<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Checklist Chain Icon</title>
  <desc>Three checked items on a checklist joined to a linked chain.</desc>
  <rect width="512" height="512" rx="112" fill="#6a55e0"/>

  <g id="chain" fill="none" stroke="#f5f6fa" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <rect id="chain-link-1" x="270" y="94" width="164" height="92" rx="46" transform="rotate(-34 352 140)"/>
    <rect id="chain-link-2" x="296" y="218" width="164" height="92" rx="46" transform="rotate(-34 378 264)"/>
  </g>

  <g id="checklist">
    <rect x="64" y="72" width="292" height="368" rx="48" fill="#f5f6fa"/>
    <path id="checkmark-1" d="M104 158l18 18 34-38" fill="none" stroke="#6a55e0" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="checkmark-2" d="M104 256l18 18 34-38" fill="none" stroke="#6a55e0" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="checkmark-3" d="M104 354l18 18 34-38" fill="none" stroke="#6a55e0" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M196 158h112M196 256h112M196 354h112" fill="none" stroke="#6a55e0" stroke-width="18" stroke-linecap="round"/>
  </g>
</svg>
