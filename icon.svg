<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Cup with a Chain Handle</title>
  <desc>A warm ivory teacup with two interlocking sage links forming its handle, on a soft mint background.</desc>
  <defs>
    <linearGradient id="mint" x2="0" y2="1"><stop stop-color="#d7efe1"/><stop offset="1" stop-color="#abd9c3"/></linearGradient>
    <linearGradient id="ceramic" x2="1" y2="1"><stop stop-color="#fffdf2"/><stop offset="1" stop-color="#f0dfbc"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#mint)"/>
  <ellipse cx="255" cy="388" rx="132" ry="19" fill="#528577" opacity=".14"/>
  <ellipse cx="250" cy="375" rx="135" ry="19" fill="#f4edda"/>
  <ellipse cx="250" cy="371" rx="106" ry="10" fill="#d6ccb4"/>
  <g id="chain-handle" fill="none" stroke="#507e70" stroke-width="18" stroke-linecap="round">
    <rect id="chain-link-1" x="312" y="215" width="108" height="54" rx="27" transform="rotate(32 366 242)"/>
    <rect id="chain-link-2" x="310" y="272" width="108" height="54" rx="27" transform="rotate(-32 364 299)"/>
    <path d="M388 265l10 8" stroke="#badfc9" stroke-width="23"/>
    <path d="M388 265l10 8" stroke="#507e70" stroke-width="14"/>
  </g>
  <g id="cup">
    <path id="cup-body" d="M128 209h209l-13 104c-5 34-31 51-91 51s-87-17-92-51z" fill="url(#ceramic)"/>
    <path d="M146 231l10 72c3 22 13 33 28 38" fill="none" stroke="#fffdf5" stroke-width="9" stroke-linecap="round" opacity=".85"/>
    <ellipse id="cup-rim" cx="232.5" cy="209" rx="104.5" ry="28" fill="#fff9e9"/>
    <ellipse cx="232.5" cy="208" rx="88" ry="18" fill="#bd9473"/>
    <path d="M155 208c25-14 130-14 155 0" fill="none" stroke="#916b55" stroke-width="4" opacity=".45"/>
  </g>
  <g fill="none" stroke="#709b89" stroke-width="9" stroke-linecap="round" opacity=".6">
    <path d="M203 164c-25-24 23-31 0-57"/>
    <path d="M248 163c-24-25 24-34 0-64"/>
    <path d="M290 166c-20-20 16-28 2-46"/>
  </g>
</svg>
