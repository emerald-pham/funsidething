<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Chain Scanner · ranked FVP</title>
<script>
/*THEME-BOOT-START*/
/* Runs before first paint. Reads the device-local paint hint left by
   writeThemeHint() and pins the palette, so an explicit light/dark choice
   never flashes the other one while the synced state loads. No hint means
   no attribute, which leaves color-scheme: light dark following the OS. */
(function(){
  try{
    var t = localStorage.getItem("fvp:chain-scanner:theme");
    if(t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  }catch(e){}
})();
/*THEME-BOOT-END*/
</script>

   Leave the PASTE_ values alone to run local-only (localStorage).
   These values are public by design; your data is protected by the
   Firestore security rule, which allows a signed-in user to touch
   only their own users/{uid} document.
   ===================================================================== */

  authDomain: "chain-scanner.firebaseapp.com",

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&family=Spline+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Every token carries both values. Which one resolves is decided by the
     used value of color-scheme below — so night mode needs no JS at all,
     and follows the OS the instant it changes. */
  color-scheme: light dark;
  --bg:light-dark(#f5f6fa,#12141b); --panel:light-dark(#ffffff,#1a1d26);
  --ink:light-dark(#242a3a,#e3e6f0); --mut:light-dark(#666d80,#9198ad);
  --line:light-dark(#e5e7f0,#2c3140);
  --chain:light-dark(#8f7bf0,#8f7bf0); --chain-deep:light-dark(#6a55e0,#6a55e0);
  --accent:light-dark(#5b46d6,#ab9ef9);   /* links & icons: text, never a fill */
  --chain-ink:light-dark(#ffffff,#ffffff);   /* sits on the purple card in both themes */
  --cand-bg:light-dark(#fff8e2,#302814); --cand-line:light-dark(#e9c34d,#7d6528);
  --cand-ink:light-dark(#7a5c00,#f2dda3);
  --yes:light-dark(#2f9e48,#35a94d); --no:light-dark(#f0930f,#e08a12);
  --cant:light-dark(#57677a,#5f7085); --danger:light-dark(#e5484d,#e0484d);
  --good:light-dark(#27b04e,#2fb257); --chip:light-dark(#f0f1f7,#262b38);
  /* surfaces that used to be hardcoded white or near-white */
  --surface:light-dark(#ffffff,#232733); --subtle:light-dark(#fafbfe,#171a22);
  --track:light-dark(#e6e8f0,#2c3140); --rowline:light-dark(#f0f1f7,#242935);
  --font-ui:"Spline Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-q:"Newsreader",Georgia,"Times New Roman",serif;
  --font-mono:"Spline Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased}
.wrap{max-width:700px;margin:0 auto;padding:14px 14px 60px}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
a{color:var(--accent)}
input[type=text],input[type=url],input[type=number],input[type=date],textarea,select{
  font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
textarea{width:100%;font-family:var(--font-mono);font-size:12px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- header ---------- */
.top{margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.titles h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.01em}
.topbtns{margin-left:auto;display:flex;gap:4px}
.ghost{color:var(--mut);border:1px solid transparent;border-radius:8px;padding:5px 9px;font-size:13px}
.ghost:hover{background:var(--surface);border-color:var(--line);color:var(--ink)}
.syncbtn{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:var(--mut);background:var(--surface);white-space:nowrap;width:88px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box}
.syncbtn:hover{color:var(--accent);border-color:var(--accent)}
.syncbtn.ok{color:var(--good);border-color:light-dark(#bfe6c9,#2c5a3b)}
.syncbtn.err{color:var(--danger);border-color:light-dark(#f4c2c3,#6b3235)}
.syncbtn.busy{color:var(--accent);border-color:light-dark(#ddd7fb,#3a3268)}
.passbar{display:flex;align-items:center;gap:10px;margin-top:10px}
.ptrack{flex:1;height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.ptrack i{display:block;height:100%;width:0%;background:var(--good);border-radius:99px;transition:width .25s ease}
.plabel{font-size:12px;color:var(--mut);min-width:52px;text-align:right}

/* ---------- panels ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(20,24,48,.04)}
.ctx{padding:0;margin-bottom:14px;overflow:hidden}
.ctx .chead{width:100%;text-align:left;padding:10px 14px;font-weight:600;font-size:13.5px;background:var(--subtle);border-bottom:1px solid transparent}
.ctx.open .chead{border-bottom-color:var(--line)}
.ctx .chead .n{color:var(--mut);font-weight:500}
.ctxgrid{display:flex;flex-wrap:wrap;gap:2px 18px;padding:12px 14px}
.ctxitem{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:14px}
.ctxitem input{accent-color:var(--chain-deep);width:16px;height:16px}
.ctxitem.off{color:var(--mut)}
.ctxadd{color:var(--mut);font-size:13px;padding:4px 8px;border:1px dashed var(--line);border-radius:8px;align-self:center}
.ctxadd:hover{color:var(--accent);border-color:var(--accent)}

/* ---------- scan stage ---------- */
#scan{margin-bottom:16px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:2px 2px 10px;font-size:12.5px;color:var(--mut)}
.crumbs .lbl{font-weight:600}
.crumb{background:light-dark(#eceafd,#272247);color:var(--accent);border:1px solid light-dark(#ddd7fb,#3a3268);border-radius:99px;padding:2px 10px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb:hover{background:light-dark(#e0dcfb,#322a58)}
.crumbs .arrow{color:light-dark(#b9b3e8,#5f5796)}

.cardrow{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.card{flex:1;border-radius:12px;padding:13px 15px;display:flex;align-items:center;gap:11px;min-height:52px}
.card .title{font-weight:600;font-size:15.5px;overflow-wrap:anywhere}
.card a{color:inherit}
.bench{background:linear-gradient(180deg,var(--chain) 0%,var(--chain-deep) 140%);color:var(--chain-ink);box-shadow:0 3px 10px rgba(106,85,224,.28)}
.bench a{text-decoration-color:rgba(255,255,255,.6)}
.cand{background:var(--cand-bg);border:1.5px solid var(--cand-line);color:var(--cand-ink)}
.cand a{color:light-dark(#8a6800,#e8ce8e)}
.chiprow{display:flex;gap:6px;margin-left:auto;flex:none;align-items:center}
.chip{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;letter-spacing:.02em}
.chip.due-today{background:var(--no);color:#fff}
.chip.due-overdue{background:var(--danger);color:#fff}
.chip.due-tomorrow{background:light-dark(#ffe1b0,#5c4413);color:light-dark(#8a5b00,#ffd699)}
.chip.due-later{background:var(--chip);color:var(--mut)}
.chip.ever{background:transparent;color:inherit;opacity:.75;font-weight:500;font-style:italic;padding:0}
.chip.notstarted{background:transparent;color:var(--mut);opacity:.85;font-weight:600;border:1px dashed var(--line)}
.siderail{display:flex;flex-direction:column;gap:7px;align-items:flex-end;flex:none;padding-top:2px;min-width:86px}
.benchblock{margin-bottom:10px}
.actionrow{display:flex;flex-wrap:wrap;gap:7px;align-items:center;justify-content:flex-end;margin-top:8px;transition:opacity .2s ease}
.actionrow.disabled{opacity:.5}
.actionrow.disabled:hover{opacity:1}
.siderail.disabled{opacity:.5}
.siderail.disabled:hover{opacity:1}
.btnwrap.disabled{opacity:.5}
.btnwrap.disabled:hover{opacity:1}
/* Divides the dotted task and its actions from the candidate being weighed
   against it. --line is the app's hairline token, so it follows the theme. */
.sep{border:0;border-top:1px solid var(--line);margin:14px 0 12px}
.sidesm{font-size:12px;color:var(--mut);text-decoration:underline dotted}
.sidesm:hover{color:var(--ink)}
.btn{border-radius:8px;border:1px solid transparent;padding:8px 16px;font-weight:700;font-size:14px;color:#fff;box-shadow:0 1px 2px rgba(20,24,48,.15)}
.btn:active{transform:translateY(1px)}
.btn.sm{padding:6px 12px;font-size:13px}   /* the siderail size — every action beside a card uses it */
.btn.dislodge{background:var(--danger)}
.btn.worked{background:var(--cant)}
.btn.yes{background:var(--yes)}
.btn.no{background:var(--no)}
.btn.cant{background:var(--cant)}
.btn.subtle{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none;font-weight:600}
.btn.urgent{background:var(--chain-deep)}
.btn.dot{background:var(--chain-deep)}   /* the chain's own colour — this is the button that puts a task on it */
.qline{font-family:var(--font-q);font-style:italic;font-size:19px;margin:16px 2px 12px;color:var(--ink)}
.qline .until{white-space:nowrap}
.decide{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.keyhint{font-size:10px;opacity:.7;font-weight:500;margin-left:5px}
.sparkbox{display:flex;align-items:center;gap:8px;margin-left:auto}
.spark{display:block}
.spark path.area{fill:light-dark(rgba(106,85,224,.15),rgba(157,139,245,.22))}
.spark path.line{fill:none;stroke:var(--accent);stroke-width:1.5}
.topkchip{font-size:11.5px;color:var(--mut)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px}
.iconbtn:hover{color:var(--accent);border-color:var(--accent)}

.notice{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;margin-top:6px}
.notice .big{font-size:15.5px;font-weight:600;margin-bottom:10px}
.notice.intervene .big{font-weight:600}
.notice .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice .quiet{color:var(--mut);font-size:13px}
.emptystate{text-align:center;color:var(--mut);padding:34px 10px;font-size:14.5px}

/* ---------- list ---------- */
.listwrap{padding:0;overflow:hidden}
.lhead{width:100%;text-align:left;padding:11px 14px;font-weight:600;font-size:13.5px;background:var(--subtle);border-bottom:1px solid transparent}
.lhead .mono{color:var(--mut);font-weight:500}
#listBody{border-top:1px solid var(--line);max-height:60vh;overflow-y:auto}
.lfilters{padding:9px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px;background:var(--subtle)}
#listSearch{width:100%;font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:inherit}
.ltags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ltaglabel{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.ltags:empty{display:none}
.ltag{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--mut);background:var(--surface);cursor:pointer}
.ltag.on{background:var(--chain-deep);color:#fff;border-color:var(--chain-deep)}
.trow{display:grid;grid-template-columns:88px 118px 1fr;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--rowline)}
.trow:last-child{border-bottom:none}
.trow.flash{animation:flash 1.6s ease}
@keyframes flash{0%{background:light-dark(#fff3c4,#3a3318)}100%{background:transparent}}
.trow .spark{opacity:.9}
.tk{display:flex;flex-direction:column;gap:2px}
.tk .tkl{font-size:10.5px;color:var(--mut);font-family:var(--font-mono)}
.tk .tkbar{height:7px;border-radius:99px;background:var(--track);overflow:hidden}
.tk .tkbar i{display:block;height:100%;background:var(--chain-deep);border-radius:99px}
.tmain{display:flex;align-items:center;gap:8px;min-width:0}
.tmain .tt{font-size:14.5px;text-align:left;overflow-wrap:anywhere}
.tmain .tt:hover{color:var(--accent)}
.tmain a.ext{font-size:12px;text-decoration:none;flex:none}
.tmain .chip{flex:none}
.tmain .inchain{flex:none;color:var(--accent);font-size:13px}
.tmain .chainind{flex:none;color:var(--mut);font-size:13px;opacity:.6}
.tmain .skipped{flex:none;color:var(--mut);font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.addwrap{padding:0;overflow:hidden;margin-top:14px}
.ahead{margin:0;text-align:left;padding:11px 14px;font-weight:600;font-size:13.5px;background:var(--subtle);border-bottom:1px solid var(--line);color:var(--fg)}
.addrow{display:flex;flex-direction:column;gap:8px;padding:12px 14px}
.addline{display:flex;gap:8px}
.addline input{flex:1;min-width:0}
.qctx{display:flex;flex-wrap:wrap;gap:6px}
.qctx:empty{display:none}
.qctxchip{font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--mut);background:var(--surface);cursor:pointer}
.qctxchip.on{background:var(--chain-deep);color:#fff;border-color:var(--chain-deep)}
.histwrap{padding:0;overflow:hidden;margin-top:14px}
.histwrap .chead{width:100%;text-align:left;padding:10px 14px;font-weight:600;font-size:13.5px;background:var(--subtle);border-bottom:1px solid transparent}
.histwrap.open .chead{border-bottom-color:var(--line)}
.histwrap .chead .n{color:var(--mut);font-weight:500}
.histbody{padding:2px 14px;max-height:40vh;overflow-y:auto}
.histempty{padding:4px 0 14px;color:var(--mut);font-size:13px}
.drow{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rowline);font-size:13px}
.drow:last-child{border-bottom:none}
.dt{text-decoration:line-through;opacity:.75;flex:1;overflow-wrap:anywhere;color:var(--ink)}
.dt.logged{text-decoration:none;opacity:1}   /* still an open, active task — not actually crossed off */
.dkind{color:var(--mut);font-size:11px;font-weight:600}
.dwhen{color:var(--mut);font-size:11px;flex:none}
.restore{font-size:12px;text-decoration:underline;color:var(--mut);flex:none}
.histfoot{padding:4px 14px 12px}
.foot{margin-top:22px;text-align:center;font-size:12px;color:var(--mut)}
.themerow{margin-top:12px}
.themebtn{border:1px solid var(--line);background:var(--surface);color:var(--mut);
  border-radius:99px;padding:7px 16px;font-size:12.5px;font-weight:600;min-height:34px}
.themebtn:hover{color:var(--accent);border-color:var(--accent)}
.foot a{color:var(--mut)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:light-dark(#242a3a,#333a4a);color:light-dark(#ffffff,#e6e8f0);
  font-size:13.5px;padding:9px 16px;border-radius:99px;box-shadow:0 6px 20px rgba(20,24,48,.28);z-index:80;
  opacity:0;transition:opacity .18s ease,transform .18s ease;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
#importMsg{font-size:13px;color:var(--good);margin-top:6px;min-height:18px}
#importMsg.warn{color:var(--no)}

/* ---------- modal ---------- */
.mback{position:fixed;inset:0;background:rgba(28,26,50,.42);display:flex;align-items:flex-start;justify-content:center;padding:5vh 14px;z-index:50}
.modal{background:light-dark(#ffffff,#1e222c);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:20px 22px;box-shadow:0 18px 50px rgba(20,20,50,.35)}
.modal h2{margin:0 0 4px;font-size:17px}
.modal h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 0 8px}
.modal .mtop{display:flex;align-items:center}
.modal .x{margin-left:auto;color:var(--mut);font-size:18px;padding:2px 8px}
.frow{display:flex;gap:10px;align-items:center;margin:9px 0;flex-wrap:wrap}
.frow label{min-width:96px;font-size:13.5px;color:var(--mut)}
.frow input[type=text],.frow input[type=url]{flex:1;min-width:180px}
.ctxpick{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0}
.ctxpick label{display:flex;gap:6px;align-items:center;font-size:13.5px;min-width:0}
.mbtns{display:flex;gap:9px;margin-top:18px;flex-wrap:wrap;align-items:center}
.mbtns.formacts{margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.cbox{display:flex;gap:6px;align-items:center;min-width:0}
.btn.danger{background:var(--danger)}
.btn.done{background:var(--yes)}
.btn.primary{background:var(--chain-deep)}
.mgr{display:flex;gap:8px;align-items:center;margin:5px 0}
.mgr input[type=text]{flex:1}
.help ol{padding-left:20px;line-height:1.65}
.help li{margin:4px 0}
.kv{font-size:13.5px;color:var(--mut);line-height:1.6}
.kv b{color:var(--ink)}
.statusdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

@media (max-width:560px){
  .trow{grid-template-columns:70px 92px 1fr;gap:8px;padding:8px 10px}
  .siderail{min-width:72px}
  .qline{font-size:17px}
  /* Edit pane on a phone: stack every field label above a full-width control
     instead of cramming them onto one line, and give the actions real
     thumb-sized targets that share the row evenly rather than wrapping ragged. */
  .modal{padding:16px 14px}
  .frow{flex-direction:column;align-items:stretch;gap:5px;margin:12px 0}
  .frow label{min-width:0}
  .frow input[type=text],.frow input[type=url],.frow input[type=date]{width:100%;min-width:0}
  .frow .cbox{flex-direction:row;align-items:center;min-height:32px}
  .mbtns .btn{flex:1 1 auto;min-height:44px;margin-left:0!important}
  .histbody{max-height:28vh}   /* shorter scroll window on a phone — worked-on/evergreen entries can make this long */
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="titles">
        <h1>Chain Scanner</h1>
      </div>
      <div class="topbtns">
        <button id="syncBtn" class="syncbtn" data-act="sync" hidden></button>
        <button class="ghost" data-act="undo" title="Undo last action (u)">↺ undo<span class="keyhint">u</span></button>
        <button class="ghost" data-act="help" title="Quick start">?</button>
        <button class="ghost" data-act="settings" title="Settings, contexts, import/export">⚙</button>
      </div>
    </div>
    <div class="passbar" title="How far down the list this pass has gone">
      <div class="ptrack"><i id="passFill"></i></div>
      <span id="passLabel" class="plabel mono"></span>
    </div>
  </header>

  <section class="panel ctx open" id="ctxPanel"></section>

  <main id="scan" aria-live="polite"></main>

  <section class="panel listwrap" id="listWrap">
    <button class="lhead" data-act="toggle-list"><span id="listCaret">▸</span> All tasks <span id="listCount" class="mono"></span></button>
    <!-- Lives outside #listBody on purpose: renderList() rebuilds that body wholesale
         on every commit, which would blow away a focused input mid-keystroke. -->
    <div class="lfilters" id="listFilters" hidden>
      <input id="listSearch" type="search" placeholder="Search tasks by name…" aria-label="Search tasks by name" autocomplete="off"/>
      <div class="ltags" id="listTagRow"></div>
    </div>
    <div id="listBody" hidden></div>
  </section>

  <!-- Its own panel, not a footer on the list above: capturing a task and
       reviewing the ones you have are different jobs, and the add bar stays
       usable whether the list is open or collapsed. -->
  <section class="panel addwrap" id="addPanel">
    <h2 class="ahead">Add a task</h2>
    <div class="addrow">
      <div class="qctx" id="quickCtxRow"></div>
      <div class="addline">
        <input id="addInput" type="text" placeholder="Add a task — or paste a whole numbered list…" aria-label="New task title, or paste a list to bulk import"/>
        <button class="btn subtle" data-act="add">Add</button>
        <button id="addDotBtn" class="btn urgent" data-act="add-dot" title="Urgent — add it with a dot so it's done first (rule 8)">Add &amp; dot</button>
      </div>
    </div>
  </section>

  <section class="panel histwrap" id="histPanel"></section>

<script>
"use strict";
/* ================================================================
   ENGINE — strength posteriors, rank distributions, stopping stats
   ================================================================ */
/*ENGINE-START*/
const BETA = 25/6;          // performance noise (TrueSkill-style)
const TAU  = 0.10;          // dynamics: keeps old ratings a little plastic
const PRIOR_MU = 25, PRIOR_SIGMA = 25/3;
const SIGMA_FLOOR = 0.8;

let _spare = null;
function gauss(){ // Box–Muller with spare
  if(_spare !== null){ const s=_spare; _spare=null; return s; }
  let u=0,v=0; while(u===0)u=Math.random(); while(v===0)v=Math.random();
  const m=Math.sqrt(-2*Math.log(u));
  _spare = m*Math.sin(2*Math.PI*v);
  return m*Math.cos(2*Math.PI*v);
}
function phi(x){ return Math.exp(-x*x/2)/Math.sqrt(2*Math.PI); }
function Phi(x){ // Zelen & Severo approximation
  const t = 1/(1+0.2316419*Math.abs(x));
  const d = phi(x);
  const p = d*t*(0.319381530 + t*(-0.356563782 + t*(1.781477937 + t*(-1.821255978 + t*1.330274429))));
  return x >= 0 ? 1-p : p;
}
function truncGaussVW(t){ // v and w for the win update
  const denom = Phi(t);
  if(denom < 1e-9){ const v = -t; return {v, w:1}; }
  const v = phi(t)/denom;
  return {v, w: v*(v+t)};
}
// winner/loser are {mu, sigma}; mutates both
function updatePair(winner, loser){
  winner.sigma = Math.sqrt(winner.sigma*winner.sigma + TAU*TAU);
  loser.sigma  = Math.sqrt(loser.sigma*loser.sigma + TAU*TAU);
  const c = Math.sqrt(2*BETA*BETA + winner.sigma**2 + loser.sigma**2);
  const {v, w} = truncGaussVW((winner.mu - loser.mu)/c);
  winner.mu += (winner.sigma**2/c)*v;
  loser.mu  -= (loser.sigma**2/c)*v;
  winner.sigma = Math.sqrt(Math.max(SIGMA_FLOOR**2, winner.sigma**2*(1-(winner.sigma**2/(c*c))*w)));
  loser.sigma  = Math.sqrt(Math.max(SIGMA_FLOOR**2, loser.sigma**2 *(1-(loser.sigma**2 /(c*c))*w)));
}
function pBeats(a, b){ // P(a preferred over b) — match-outcome scale
  return Phi((a.mu - b.mu)/Math.sqrt(2*BETA*BETA + a.sigma**2 + b.sigma**2));
}
const PRED_NOISE = 1.5; // a single "would I rather?" judgment is far less noisy than a match
function pJudged(a, b){ // P(you'd answer Yes for a over b)
  return Phi((a.mu - b.mu)/Math.sqrt(2*PRED_NOISE*PRED_NOISE + a.sigma**2 + b.sigma**2));
}
/* Monte-Carlo rank distributions over a set of items with {id, mu, sigma}.
   Returns Map id -> {hist:Float32Array(n) of P(rank=i+1), cdf, topK, n} */
function rankStats(items, S){
  const n = items.length;
  const out = new Map();
  if(n === 0) return out;
  S = S || 250;
  const hists = items.map(()=> new Float32Array(n));
  const idx = new Array(n); const score = new Float64Array(n);
  for(let s=0; s<S; s++){
    for(let i=0;i<n;i++){ score[i] = items[i].mu + items[i].sigma*gauss(); idx[i]=i; }
    idx.sort((a,b)=> score[b]-score[a]);
    for(let r=0;r<n;r++) hists[idx[r]][r]++;
  }
  for(let i=0;i<n;i++){
    const h = hists[i]; const cdf = new Float32Array(n); let acc=0;
    for(let r=0;r<n;r++){ h[r]/=S; acc+=h[r]; cdf[r]=Math.min(1,acc); }
    // "arcane" stopping stat: smallest K (≥2) with P(rank ≤ K) ≥ 1 − 1/K
    let topK = n;
    if(n === 1){ topK = 1; }
    else { for(let k=2;k<=n;k++){ if(cdf[k-1] >= 1 - 1/k){ topK = k; break; } } }
    out.set(items[i].id, {hist:h, cdf, topK, n});
  }
  return out;
}
// Thompson sampling: draw one plausible strength per item, take the max
function thompsonPick(items){
  let best=null, bv=-Infinity;
  for(const it of items){ const v = it.mu + it.sigma*gauss(); if(v>bv){ bv=v; best=it; } }
  return best;
}
/* Chance that at least one of the next `perMin` candidates beats the benchmark */
function chanceBetterSoon(bench, pool, perMin){
  if(!pool.length) return 0;
  const M = Math.max(1, Math.min(pool.length, Math.round(perMin)));
  const ps = pool.map(c=> pJudged(c, bench)).sort((a,b)=> b-a).slice(0, M);
  let none = 1; for(const p of ps) none *= (1-p);
  return 1-none;
}
function median(arr){ if(!arr.length) return NaN; const s=[...arr].sort((a,b)=>a-b); const m=s.length>>1; return s.length%2 ? s[m] : (s[m-1]+s[m])/2; }
/*ENGINE-END*/

/* ================================================================
   APP STATE
   ================================================================ */
const STORE_KEY = "fvp:chain-scanner:v1";
const THEME_HINT_KEY = "fvp:chain-scanner:theme";   // paint-time cache only; see writeThemeHint()
const STALE_PASS_MS = 18 * 3600000;   // a scan pass older than this auto-recycles (newPass) — see ensureCandidate()
const PASS_RESET_HOUR = 2;            // ...and so does one that crosses 02:00 local — the "new day" line, usually the trigger that trips first
let _uidc = 0;
const uid = ()=> "t" + Date.now().toString(36) + (_uidc++).toString(36);
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* Only ever store/render navigable URLs. Blocks javascript:, data:, vbscript:
   and friends, which would otherwise run in this origin when clicked. */
function safeUrl(u){
  u = String(u==null ? "" : u).trim();
  if(!u) return null;
  if(/[\u0000-\u001f]/.test(u)) return null;              // control chars used to smuggle schemes
  if(/^(https?:|mailto:)/i.test(u)) return u;
  if(/^[a-z][a-z0-9+.-]*:/i.test(u)) return null;          // any other explicit scheme → reject
  if(/^\/\//.test(u)) return "https:" + u;                 // protocol-relative
  return null;                                             // bare/relative → not useful here
}

let state = null;
let rankCache = new Map();     // id -> {hist,cdf,topK,n}
let sparkCache = new Map();    // id:WxH -> memoized sparkline SVG string; cleared whenever rankCache changes
let undoStack = [];
let quickAddCtx = [];          // context ids currently picked in the quick-add bar — UI-only, sticky across adds, not synced
let listQuery = "";            // all-tasks search box, already trimmed + lowercased — UI-only, like quickAddCtx: never saved, never synced, never undoable
let listTagFilter = null;      // ...and the one filter key the list is narrowed to ("s:no", "c:c_home"), or null. One at a time, by design.
let saveTimer = null;
let storageOK = false;
let useLocal  = false;   // true when running as a plain web page (localStorage)

function todayISO(offsetDays){
  const d = new Date(); d.setDate(d.getDate() + (offsetDays||0));
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function isoToDate(iso){ const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d); }
/* "repeats daily" was removed. Nothing reads t.recur any more, but a stored or

function dropRemovedFields(st){ for(const t of (st && st.tasks) || []) delete t.recur; }

/* Backfills fields that a state from an older version — local storage, a cloud
   payload, or an imported export — may predate, so the rest of the app can
   assume they're present. Idempotent, and deliberately DOM-free: callers
   repaint the theme themselves right after. */
function hydrateState(st){
  if(!st.settings) st.settings = {horizonMin:60,thresholdPct:25,samples:250,cantMin:30,workedHours:8};
  if(st.settings.cantMin===undefined) st.settings.cantMin=30;
  if(st.settings.workedHours===undefined) st.settings.workedHours=8;
  st.settings.theme = normalizeTheme(st.settings.theme);   // absent or corrupt -> "system"
  if(st.histOpen===undefined) st.histOpen=false;
  // Older states have no passStartedAt. If a chain is in progress there IS a
  // pass, we just don't know when it began — stamp it as of now so it gets a
  // full fresh stale-pass window from the upgrade rather than being invisible
  // to the check forever. No chain means no pass to clock: leave it 0.
  if(st.passStartedAt===undefined) st.passStartedAt = (st.chain && st.chain.length) ? Date.now() : 0;
  if(!st.cantAt) st.cantAt = {};
  if(!st.workedAt) st.workedAt = {};
  if(!st.workLog) st.workLog = [];
}

function defaultState(){
  const C = (id,name,active)=>({id,name,active});
  const contexts = [
    C("c_home","At home",true), C("c_laptop","Have my laptop",true), C("c_car","Have the car",true),
    C("c_work","At work",true), C("c_quiet","Quiet house",true), C("c_errand","Out running errands",true)
  ];
  const T = (title,opts)=> Object.assign({
    id: uid(), title, url:null, due:null, evergreen:false, ctx:[],
    mu: PRIOR_MU, sigma: PRIOR_SIGMA, done:false, createdAt:Date.now(), completedAt:null, lastDoneAt:null
  }, opts||{});
  const tasks = [];   // start empty — add your own, or paste your Obsidian list in Settings
  return {
    v:1, tasks, contexts,
    chain: [], considered: {}, cantAt: {}, workedAt: {}, candidateId: null, workLog: [],
    interventionActive:false, interventionP:0, snooze:0,
    mode:"scan", decisionsMs:[], presentedAt:0, passStartedAt:0,
    listOpen:false, ctxOpen:true, histOpen:false, updatedAt:0, syncRev:0,
    settings:{ horizonMin:60, thresholdPct:25, samples:250, cantMin:30, workedHours:8, theme:"system" }
  };
}

/* ---------- night mode ----------
   Three preferences: "system" (default), "light", "dark". The preference is
   part of state.settings, so it rides the cloud sync across devices. */
const DARK_QUERY = "(prefers-color-scheme: dark)";

function normalizeTheme(v){ return (v==="light"||v==="dark") ? v : "system"; }

function prefersDarkOS(){
  try{ return !!(window.matchMedia && window.matchMedia(DARK_QUERY).matches); }
  catch(e){ return false; }   // no matchMedia (old browser, bare JS host) — assume light
}

function themePref(){ return normalizeTheme(state && state.settings && state.settings.theme); }

function resolvedTheme(){
  const pref = themePref();
  return pref === "system" ? (prefersDarkOS() ? "dark" : "light") : pref;
}

/* An explicit choice becomes an attribute on <html>, which pins color-scheme
   and therefore every light-dark() token. "system" removes the attribute so
   the bare `color-scheme: light dark` takes over — that is what makes the
   palette follow the OS live, with no JS in the loop at all. */
function applyTheme(){
  const root = document && document.documentElement;
  if(!root) return;
  const pref = themePref();
  if(pref === "system") root.removeAttribute("data-theme");
  else root.setAttribute("data-theme", pref);
  writeThemeHint(pref);
}

/* The preference lives in synced state, which loads asynchronously — too late
   to stop a flash of the wrong palette. So mirror it into localStorage, which
   the boot script in <head> can read synchronously. Device-local on purpose,
   and cleared for "system" so a stale hint can never outvote the OS. */
function writeThemeHint(pref){
  try{
    if(pref === "light" || pref === "dark") localStorage.setItem(THEME_HINT_KEY, pref);
    else localStorage.removeItem(THEME_HINT_KEY);
  }catch(e){ /* storage blocked — we just lose the anti-flash, not the theme */ }
}

function setTheme(v){
  state.settings.theme = normalizeTheme(v);
  applyTheme();
  save();      // bumps updatedAt, so the choice pushes to your other devices
  render();
}

/* ---------- persistence (artifact key-value storage; falls back to memory) ---------- */
async function loadState(){
  if(typeof window !== "undefined" && window.storage && window.storage.get){
    try{
      const r = await window.storage.get(STORE_KEY);
      if(r && r.value){ storageOK = true; return JSON.parse(r.value); }
      storageOK = true; // storage works, just empty
    }catch(e){
      // key missing throws — probe whether storage itself works
      try{ await window.storage.set(STORE_KEY+":probe","1"); storageOK = true; }catch(_){ storageOK = false; }
    }
  }
  if(!storageOK && localStorageOK()){   // plain web page (e.g. GitHub Pages)
    useLocal = true; storageOK = true;
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){ /* corrupt payload — start fresh */ }
  }
  return null;
}
function localStorageOK(){
  try{
    const k = STORE_KEY + ":probe";
    localStorage.setItem(k, "1"); localStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}
function save(){
  state.updatedAt = Date.now();
  cloudPush();
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    if(!storageOK) return;
    if(useLocal){
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
      catch(e){ toast("Couldn't save — local storage might be full."); }
      return;
    }
    if(!window.storage) return;
    try{ await window.storage.set(STORE_KEY, JSON.stringify(state)); }
    catch(e){ toast("Couldn't save just now — will retry on your next change."); }
  }, 350);
}

/* ---------- cloud sync glue (no-ops until Firebase is configured) ----------
   Deliberately NOT a live listener: a realtime push from another device
   mid-scan would swap the benchmark card under your hand. Instead we
   reconcile on load and whenever the tab regains focus. Last write wins,
   arbitrated by state.updatedAt.

   The rule that keeps last-write-wins honest: this device may not write to
   the cloud until it has read it at least once this session. A browser left
   closed for weeks boots holding a stale chain, and every path below used to
   let that chain reach the cloud before anything had checked what was already
   up there — which is how a full day of work got overwritten. See sendPush()
   for the gate and cloudPull() for the two comparisons it depends on. */
let cloudTimer = null, lastPushed = "", pulling = false;
let reconciledAs = null;   // the account whose cloud copy this session has successfully READ
let pendingPush = false;   // a write was asked for before that happened — released once we reconcile
let baseUpdatedAt = 0;     // state.updatedAt as it came off this device's disk, before any edit re-stamped it

function cloudReady(){ const CS = window.CloudSync; return !!(CS && CS.ready && CS.user); }
/* Deliberately keyed on the account, not a bare boolean: signing out and in as
   somebody else puts us right back to knowing nothing about the document we
   would be writing to, so the gate below has to re-arm rather than coast on a
   reconcile that belonged to the previous account. */
function reconciled(){ return reconciledAs !== null && cloudReady() && reconciledAs === window.CloudSync.user; }
function cloudPush(){
  if(!cloudReady()) return;
  if(cloudTimer) clearTimeout(cloudTimer);
  cloudTimer = setTimeout(()=>{ cloudTimer = null; sendPush(); }, 2000);   // slow enough not to burn a write per keystroke
}
/* Bypasses the debounce above for moments that shouldn't wait — dotting a
   task onto the chain, or deleting one. Cancels any pending debounced push
   and sends the current state right now instead. */
function cloudPushNow(){
  if(!cloudReady()) return;
  if(cloudTimer){ clearTimeout(cloudTimer); cloudTimer = null; }
  sendPush();
}
/* The single gate every cloud write goes through.

   BUG FIX: being signed in used to be enough. That let a browser holding
   weeks-old localStorage overwrite a chain that had been built up in the
   cloud all day — cloudPushNow() writes with no comparison at all, so one
   dot in a stale tab, landing before or racing the session's first pull, was
   enough to destroy the remote document. A write only means something once
   we know what it would be overwriting, so until this session has read the
   cloud we hold the write and go read first. cloudPull() releases it. */
function sendPush(){
  if(!cloudReady()) return;
  if(!reconciled() || pulling){
    pendingPush = true;
    if(!pulling) cloudPull();   // self-healing: the write triggers the reconcile it is waiting on
    return;
  }
  const payload = cloudPayload();
  if(payload === lastPushed) return;      // nothing actually changed
  lastPushed = payload;
  const base = state.syncRev;
  Promise.resolve(window.CloudSync.push(payload, state.updatedAt || Date.now(), base))
    .then(res=>{
      if(!res) return;                    // an older shim with nothing to say — leave the rev alone
      if(res.conflict){
        /* Somebody else wrote a revision we had not read. The write did NOT
           land, on purpose: overwriting it is exactly the data loss this is
           here to prevent. Go read what they wrote and reconcile instead. */
        lastPushed = "";
        pendingPush = true;
        cloudPull();
        return;
      }
      if(typeof res.rev === "number") state.syncRev = res.rev;
    })
    .catch(()=>{ lastPushed = ""; });      // a failed write must not look like a synced one
}
/* What actually goes into the cloud document. state.syncRev is this device's
   bookkeeping — which revision its copy is based on — and is deliberately kept
   out: if it rode along in the payload, every device would see a difference
   immediately after adopting somebody else's state and push it straight back. */
function cloudPayload(){
  const out = {};
  for(const k of Object.keys(state)) if(k !== "syncRev") out[k] = state[k];
  return JSON.stringify(out);
}
/* BUG FIX: CS.push/CS.pull each ping() (fire the "cloudsync" event) *before*
   their own await — once when they start ("syncing") and once when they
   finish ("ok"/"error"). The old listener below called cloudPull() on every
   single one of those pings, including ones fired *by cloudPull's own call
   into CS.pull* — a synchronous, unbounded feedback loop that recurses until
   the call stack overflows. The `pulling` guard collapses any pull that
   starts while one is already in flight; the event listener (further down)
   no longer triggers a pull at all, only a UI refresh. */
async function cloudPull(){
  if(!cloudReady() || !state || pulling) return;
  const firstReconcile = !reconciled();
  pulling = true;
  try{
    const remote = await window.CloudSync.pull();
    /* Three-way answer, and the destructive branch is the one that has to
       show positive proof. BUG FIX: CS.pull() used to say null both for "no
       such document" and for "the read threw", and this function read null
       as an empty cloud and seeded it from here — so one failed request on a
       stale tab overwrote a perfectly good remote document. Only an explicit
       {empty:true} authorises that now. Anything we could not read — an
       error, a malformed reply, an older shim still answering null — leaves
       us knowing nothing about the cloud, so we touch neither side. */
    const haveRemote = !!(remote && remote.payload);
    if(!haveRemote && !(remote && remote.empty)) return;
    reconciledAs = window.CloudSync.user;
    if(!haveRemote){                           // empty cloud — seed it from this device
      state.syncRev = 0;                       // no document yet, so nothing is behind us
      if(state.tasks.length){ lastPushed = ""; cloudPush(); }
      return;
    }
    /* Who is ahead?

       BUG FIX: this used to compare state.updatedAt against the document's,
       and both are stamped with Date.now() on whichever device wrote them —
       its OWN clock. A laptop running a few hours fast therefore won every
       reconcile no matter how old its content was, and overwrote a phone's
       newer work, renames included. Wall-clock time cannot order edits made
       on two machines; nothing built on it was ever going to hold.

       So the document carries a revision counter instead, and each device
       remembers which revision its copy is based on (state.syncRev, kept out
       of the payload). Higher remote revision means the cloud holds work this
       device has never seen — adopt it. Same revision means we share a base,
       so any local difference is genuinely this device's to push. No clocks.

       The timestamp comparison survives only as the migration path, for a
       document written before revisions existed or a device that has never
       synced under them; the first write on either side ends it. That path
       still judges an unreconciled device by the timestamp it LOADED with,
       not one a local edit re-stamped, so a stale tab can't win by being
       clicked. Nothing here is lost either way: an adoption goes on the undo
       stack, and the toast below says so. */
    const rr = typeof remote.rev === "number" ? remote.rev : null;
    const lr = typeof state.syncRev === "number" ? state.syncRev : null;
    let remoteWins;
    if(rr !== null && lr !== null){
      remoteWins = rr > lr;                                   // revisions: the real answer
      if(!remoteWins && rr === lr && remote.payload === cloudPayload()) return;   // identical, nothing to do
    }else{
      const lt = firstReconcile ? baseUpdatedAt : (state.updatedAt || 0);
      const rt = remote.updatedAt || 0;
      remoteWins = rt > lt;
    }
    if(remoteWins){
      try{
        const st = JSON.parse(remote.payload);
        if(!st || !Array.isArray(st.tasks)) return;
        const hadLocalEdits = firstReconcile && (state.updatedAt || 0) > baseUpdatedAt;
        pushUndo();                            // remote adoption is undoable
        state = st;
        lastPushed = remote.payload;
        dropRemovedFields(state);
        hydrateState(state);
        applyTheme();
        recomputeRanks(); ensureCandidate(); render();
        // Adopted wholesale, so this device is now based on the remote's
        // revision — not on whatever its own copy used to be based on.
        state.syncRev = rr !== null ? rr : (state.syncRev || 0);
        if(useLocal){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
        // Swapping the board out from under someone mid-edit needs saying out
        // loud, or the edits they just made look like they simply vanished.
        if(hadLocalEdits) toast("This tab was out of date \u2014 loaded the newer copy. \u21ba undoes it.");
      }catch(e){ /* corrupt remote — leave local alone */ }
    }else{
      // Same base revision (or an older document by timestamp): anything
      // different here is this device's own work, so send it.
      if(rr !== null && lr === null) state.syncRev = rr;   // first sync under revisions — adopt the counter
      lastPushed = ""; cloudPush();
    }
  } finally {
    pulling = false;
    // Whatever sendPush() held back while we had nothing to compare against.
    if(reconciled() && pendingPush){ pendingPush = false; sendPush(); }
  }
}
window.addEventListener("cloudsync", renderSync);   // just the status badge — pulling happens below, not here
window.addEventListener("focus", cloudPull);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) cloudPull(); });
function pushUndo(){
  undoStack.push(JSON.stringify(state));
  if(undoStack.length > 30) undoStack.shift();
}
function undo(){
  if(!undoStack.length) return;
  state = JSON.parse(undoStack.pop());
  // A full commit, not commit(false): taking something back is itself a write.
  // It has to reach storage or a reload resurrects what you just undid, and it
  // has to re-stamp updatedAt or the snapshot's stale timestamp loses the next
  // cloud reconcile to the very state it was meant to overrule.
  recomputeRanks(); commit();
}

/* ---------- derived helpers ---------- */
const taskById = id => state.tasks.find(t=>t.id===id) || null;
const openTasks = ()=> state.tasks.filter(t=>!t.done);
function activeCtxSet(){ const s=new Set(); for(const c of state.contexts) if(c.active) s.add(c.id); return s; }
function isEligible(t, act){
  if(t.done) return false;
  const now = Date.now();
  if(t.evergreen && t.lastDoneAt && (now - t.lastDoneAt) < 90*60*1000) return false; // evergreen rest
  if(t.startsAt && isoToDate(t.startsAt) > isoToDate(todayISO(0))) return false;  // not started yet — can't be queued
  act = act || activeCtxSet();
  for(const c of t.ctx){ if(state.contexts.some(x=>x.id===c) && !act.has(c)) return false; }
  return true;
}
function eligibleTasks(){ const act=activeCtxSet(); return state.tasks.filter(t=>isEligible(t,act)); }
function benchmark(){ return state.chain.length ? taskById(state.chain[state.chain.length-1]) : null; }
function expireCants(){ // a "can't" mark is bulletproof until cantMin elapses, then it clears itself
  const now = Date.now();

  for(const [id,v] of Object.entries(state.considered)){
    if(v!=="cant") continue;
    if(!state.cantAt[id]){
      // AUDIT: a "cant" with no start date — e.g. set before cantAt existed,
      // or reintroduced via an older JSON import or a cloud sync from a device
      // on an older version. Without this it can never expire (the check below
      // requires a timestamp to compare against). Backfill one now so it gets

   up looking like them.

  // dead id sitting on the chain, in a mark, or as the dealt candidate.
  state.chain = state.chain.filter(id=>!drop.has(id));

    delete state.considered[id];
    delete state.cantAt[id];

function isSkipped(t){ // has a no/can't/dislodged/worked mark — same set rescanSkipped() clears in bulk.

  // reachable — but a rank signal with nothing to rank against is a fabricated
  // one, and the guard is cheaper than trusting it stays unreachable.

/* ---------- bulk list parsing ----------
   Accepts basically any list a human would paste: numbered (1. / 1) / 1] / 1: / 1 -),
   bulleted (- * + • – —), Obsidian checkboxes, markdown links, bare URLs, or plain lines. */
function parseTaskList(text){
  const rows = [];
  for(const raw of String(text||"").split(/\r?\n/)){
    let line = raw.trim();
    if(!line) continue;
    if(/^[-*+•]?\s*\[[xX]\]/.test(line)) continue;        // already-done checkbox
    if(/^#{1,6}\s/.test(line)) continue;                   // markdown heading
    if(/^([-=_*])\1{2,}$/.test(line)) continue;             // --- horizontal rule
    // strip ONE leading marker, in the order a real list nests them
    line = line.replace(/^[-*+•–—]\s+/, "");                // bullet
    line = line.replace(/^\d+\s*[.)\]:]\s+/, "");          // 1.  1)  1]  1:
    line = line.replace(/^\d+\s*[-–—]\s+/, "");            // 1 - task
    line = line.replace(/^\[\s?\]\s*/, "");                // bare [ ] checkbox
    line = line.trim();
    if(!line) continue;
    let url = null, title = line;
    const md = line.match(/^\[([^\]]+)\]\(([^)]+)\)\s*(.*)$/);
    if(md){ title = (md[1] + " " + (md[3]||"")).trim(); url = safeUrl(md[2]); }
    else {
      const bare = line.match(/^(https?:\/\/\S+)\s+(.+)$/);   // URL then title
      if(bare){ url = safeUrl(bare[1]); title = bare[2].trim(); }
    }
    if(title) rows.push({title, url});
  }
  return rows;
}

   already finished, as brand-new open tasks, while the original sat right

   from open duplicates so the summary can say which it was. */

  const rows = parseTaskList(text);

  const open = new Set(openTasks().map(t => normTitle(t.title)));
  const done = new Set(state.tasks.filter(t=>t.done).map(t => normTitle(t.title)));

  if(skipped) msg += ", " + skipped + " duplicate" + (skipped===1?"":"s") + " skipped";

  if(!iso) return null;
  const d = isoToDate(iso); const t0 = isoToDate(todayISO(0));
  const diff = Math.round((d - t0)/86400000);
  const wd = WD[d.getDay()];
  if(diff < 0)  return {cls:"due-overdue", txt:"overdue · "+wd};
  if(diff === 0)return {cls:"due-today",   txt:wd+" · today"};
  if(diff === 1)return {cls:"due-tomorrow",txt:wd+" · tomorrow"};
  return {cls:"due-later", txt:wd+" "+(d.getMonth()+1)+"/"+d.getDate()};
}
function untilClock(){
  const d = new Date(Date.now() + state.settings.horizonMin*60000);
  let h = d.getHours(); const ap = h>=12 ? "PM" : "AM"; h = ((h+11)%12)+1;
  return h + ":" + String(d.getMinutes()).padStart(2,"0") + " " + ap;
}
function fmtWhen(ts){ // short "when this was completed" label for the history panel
  if(!ts) return "";
  const d = new Date(ts);
  const diffDays = Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()) - isoToDate(todayISO(0))) / 86400000);
  if(diffDays===0) return "today";
  if(diffDays===-1) return "yesterday";
  if(diffDays>-7) return WD[d.getDay()];
  return WD[d.getDay()] + " " + (d.getMonth()+1) + "/" + d.getDate();
}
function sparkSVG(id, w, hgt){
  w = w||84; hgt = hgt||20;
  const key = id+":"+w+"x"+hgt;
  const cached = sparkCache.get(key);
  if(cached !== undefined) return cached;
  const st = rankCache.get(id);
  let svg;
  if(!st){
    svg = '<svg class="spark" width="'+w+'" height="'+hgt+'" viewBox="0 0 '+w+' '+hgt+'"></svg>';
  }else{
    const n = st.n, hist = st.hist;
    const B = Math.max(2, Math.min(n, 44));
    const bins = new Float32Array(B);
    for(let r=0;r<n;r++) bins[Math.min(B-1, Math.floor(r*B/n))] += hist[r];
    const sm = new Float32Array(B);
    for(let i=0;i<B;i++) sm[i] = (bins[i-1]||0)*0.25 + bins[i]*0.5 + (bins[i+1]||0)*0.25;
    let max = 1e-9; for(let i=0;i<B;i++) if(sm[i]>max) max=sm[i];
    const pts = [];
    for(let i=0;i<B;i++){
      const x = (B===1) ? 0 : i/(B-1)*w;
      const y = hgt-1 - (sm[i]/max)*(hgt-3);
      pts.push(x.toFixed(1)+","+y.toFixed(1));
    }
    const line = "M"+pts.join(" L");
    const area = line + " L"+w+","+(hgt-0.5)+" L0,"+(hgt-0.5)+" Z";
    svg = '<svg class="spark" width="'+w+'" height="'+hgt+'" viewBox="0 0 '+w+' '+hgt+'" aria-hidden="true"><path class="area" d="'+area+'"/><path class="line" d="'+line+'"/></svg>';
  }
  sparkCache.set(key, svg);
  return svg;
}
function topKlabel(id){ const st = rankCache.get(id); return st ? "top-"+st.topK : ""; }

/* One tap cycles Auto -> Light -> Dark -> Auto. The label says which state
   you are in, and Auto also says what it currently resolves to, so a change
   in the OS setting is visible here and not just in the colours. */
const THEME_CYCLE = { system:"light", light:"dark", dark:"system" };
const THEME_FACE  = { system:"\u25d0 Auto", light:"\u2600 Light", dark:"\u263e Dark" };
function nextTheme(){ return THEME_CYCLE[themePref()]; }
function renderTheme(){
  const el = document.getElementById("themeBtn");
  if(!el) return;
  const pref = themePref();
  el.textContent = pref === "system" ? THEME_FACE.system + " (" + resolvedTheme() + ")" : THEME_FACE[pref];
  el.setAttribute("aria-label", "Appearance: " + pref + ". Tap to switch to " + nextTheme() + ".");
  el.setAttribute("title", "Appearance: " + pref + ". Tap to switch to " + nextTheme() + ".");
}

/* The colours follow the OS on their own through color-scheme; this listener
   exists so the Auto label repaints too when you flip the system setting. */
function watchOSTheme(){
  try{
    const mq = window.matchMedia && window.matchMedia(DARK_QUERY);
    if(!mq || !mq.addEventListener) return;
    mq.addEventListener("change", ()=>{ if(themePref()==="system") renderTheme(); });
  }catch(e){ /* no matchMedia here — nothing to react to */ }
}

function renderSync(){

/* ---------- all-tasks list filters ----------
   Two independent narrowings of the *view* only. Neither one touches
   state.contexts[].active, so what the scanner considers eligible is exactly
   the same whether you're looking at the whole list or one tag's worth of it. */

/* The states a row can visibly carry, in the order the row itself draws them:
   the due chips, the flags, then the skip mark. Filtering by one of these is
   filtering by something you can already see on the list. */
const LIST_STATUS_TAGS = [
  { id:"overdue",    label:"overdue",     match:t=>{ const d=dueInfo(t.due); return !!d && d.cls==="due-overdue"; } },
  { id:"today",      label:"due today",   match:t=>{ const d=dueInfo(t.due); return !!d && d.cls==="due-today"; } },
  { id:"notstarted", label:"not started", match:t=>!!t.startsAt && isoToDate(t.startsAt) > isoToDate(todayISO(0)) },
  { id:"evergreen",  label:"evergreen",   match:t=>!!t.evergreen },
  { id:"no",         label:"no",          match:t=>state.considered[t.id]==="no" },
  { id:"cant",       label:"can\u2019t",  match:t=>state.considered[t.id]==="cant" },
  { id:"dislodged",  label:"dislodged",   match:t=>state.considered[t.id]==="dislodged" },
  { id:"worked",     label:"worked",      match:t=>state.considered[t.id]==="worked" }
];

/* One rule for the whole row: a filter is offered only when at least one open
   task would match it. So the row is empty on a plain unmarked list, it grows
   a "dislodged" button the moment something gets dislodged, and the contexts
   you never use never show up. Keys are namespaced so a context someone names
   "no" can't collide with the no mark. */
function listTagOptions(){
  const open = openTasks();
  const out = [];
  for(const s of LIST_STATUS_TAGS){
    if(open.some(s.match)) out.push({ key:"s:"+s.id, label:s.label, match:s.match });
  }
  for(const c of state.contexts){
    if(!c.active) continue;                       // inactive contexts aren't searchable
    const match = t => t.ctx.includes(c.id);
    if(open.some(match)) out.push({ key:"c:"+c.id, label:c.name, match });
  }
  return out;
}
/* A filter can outlive what it points at: the mark gets cleared or expires, the
   task gets crossed off, the context is deactivated or deleted. When the thing
   stops being offered, the filter goes with it rather than leaving the list
   stuck behind a control that's no longer on screen. */
function normalizeListFilters(){
  if(listTagFilter && !listTagOptions().some(o=>o.key===listTagFilter)) listTagFilter = null;
}
function listFiltersActive(){ normalizeListFilters(); return !!(listQuery || listTagFilter); }
function filteredListTasks(){
  normalizeListFilters();
  const tag = listTagFilter ? listTagOptions().find(o=>o.key===listTagFilter) : null;
  return openTasks().filter(t=>{
    if(tag && !tag.match(t)) return false;
    if(listQuery && !t.title.toLowerCase().includes(listQuery)) return false;
    return true;
  });
}
function setListQuery(v){
  listQuery = String(v==null?"":v).trim().toLowerCase();
  renderList();          // body + header count; the tag chips don't depend on the query
}
function toggleListTag(id){
  listTagFilter = (listTagFilter===id) ? null : id;   // clicking the lit one clears it
  renderList();
}
function clearListFilters(){
  listQuery = ""; listTagFilter = null;
  const box = document.getElementById("listSearch");
  if(box) box.value = "";   // the only place we write back into the input, so typing is never fought
}
function renderListFilters(){
  const wrap = document.getElementById("listFilters");
  if(wrap) wrap.hidden = !state.listOpen;
  const row = document.getElementById("listTagRow");
  if(!row) return;
  if(!state.listOpen){ row.innerHTML=""; return; }
  normalizeListFilters();
  const opts = listTagOptions();
  if(!opts.length){ row.innerHTML=""; return; }   // no caption either — nothing to caption
  // Labelled because the quick-add bar carries a similar-looking chip row a few
  // pixels below, and it does something entirely different.
  row.innerHTML = '<span class="ltaglabel">Filter</span>' + opts.map(o => {
    const on = listTagFilter===o.key;
    return '<button type="button" class="ltag'+(on?" on":"")+'" data-act="list-tag" data-id="'+esc(o.key)+'"'
         + ' aria-pressed="'+(on?"true":"false")+'">'+esc(o.label)+'</button>';
  }).join("");
}

function renderList(){
  const open = openTasks();
  const act = activeCtxSet();
  renderListFilters();
  const shown = filteredListTasks();
  document.getElementById("listCount").textContent =
    listFiltersActive() ? "("+shown.length+" of "+open.length+")" : "("+open.length+")";
  document.getElementById("listCaret").textContent = state.listOpen ? "▾" : "▸";
  const body = document.getElementById("listBody");
  const savedScroll = body.scrollTop;   // every commit() rebuilds this from scratch — without this, any
  body.hidden = !state.listOpen;        // unrelated action (dotting, toggling a context) snaps it to the top
  if(!state.listOpen){ body.innerHTML=""; return; }

  const rows = [...shown].sort((a,b)=>{
    const ka = rankCache.get(a.id), kb = rankCache.get(b.id);
    const ta = ka?ka.topK:1e9, tb = kb?kb.topK:1e9;
    if(ta!==tb) return ta-tb;
    return b.mu - a.mu;
  });
  const inChain = new Set(state.chain);
  let html = "";
  for(const t of rows){
    const st = rankCache.get(t.id);
    const fill = st ? Math.max(2, Math.round(st.topK/st.n*100)) : 2;
    const consid = state.considered[t.id];
    const dim = !isEligible(t, act);
    html += '<div class="trow" data-row="'+t.id+'" style="'+(dim?"opacity:.45":"")+'">'
         + sparkSVG(t.id, 88, 22)
         + '<div class="tk"><span class="tkl">'+(st?("top-"+st.topK):"—")+'</span><div class="tkbar"><i style="width:'+fill+'%"></i></div></div>'
         + '<div class="tmain">'
         + (inChain.has(t.id) ? '<span class="inchain" title="In the chain">●</span>' : '') + (chainStart() ? '<span class="chainind" title="Will be added to the chain when you start scanning">→ </span>' : '')
         + '<button class="tt" data-act="edit" data-id="'+t.id+'">'+esc(t.title)+'</button>'
         + (safeUrl(t.url) ? '<a class="ext" href="'+esc(safeUrl(t.url))+'" target="_blank" rel="noopener noreferrer" title="Open link">↗</a>' : '')
         + chipHTML(t)
         + (consid && consid!=="done" ? '<span class="skipped">'+skippedLabel(t.id, consid)+'</span>' : '')
         + '</div></div>';
  }
  // "nothing here" and "nothing matching" are different problems with different fixes
  body.innerHTML = html || (open.length
    ? '<div class="emptystate">No tasks match.<div style="margin-top:12px"><button class="btn subtle" data-act="clear-list-filters">Clear filters</button></div></div>'
    : '<div class="emptystate">No open tasks.</div>');
  body.scrollTop = savedScroll;
}

/* Done tasks (restorable) plus logged worked-on/evergreen-done events (not —
   the task behind one of those is still open and cycling through the scan,
   so there's nothing to restore it *to*), newest first. */
function historyRows(){
  const done = state.tasks.filter(t=>t.done).map(t=>({ id:t.id, title:t.title, kind:"done", at:t.completedAt||0, restorable:true }));
  const logged = (state.workLog||[]).map(e=>({ id:e.id, title:e.title, kind:e.kind, at:e.at||0, restorable:false }));
  return [...done, ...logged].sort((a,b)=>b.at-a.at);
}
function historyKindLabel(kind){
  if(kind==="worked") return "worked on it";
  if(kind==="evergreen-done") return "done · evergreen";
  return "";
}
function renderHistory(){
  const el = document.getElementById("histPanel");
  if(!el) return;
  const prevBody = document.getElementById("histBody");  // this div is destroyed and rebuilt every render() —
  const savedScroll = prevBody ? prevBody.scrollTop : 0;  // re-find it after, by id, since the old reference is gone
  const rows = historyRows();
  el.classList.toggle("open", state.histOpen);
  let html = '<button class="chead" data-act="toggle-hist">'+(state.histOpen?"▼":"▶")+' History <span class="n">('+rows.length+(rows.length===1?" entry":" entries")+')</span></button>';
  if(state.histOpen){
    if(!rows.length){
      html += '<div class="histempty">Nothing crossed off yet.</div>';
    }else{
      html += '<div class="histbody" id="histBody">';
      for(const r of rows.slice(0,50)){
        html += '<div class="drow"><span class="dt'+(r.restorable?"":" logged")+'">'+esc(r.title)
             + (r.restorable?"":' <span class="dkind">'+historyKindLabel(r.kind)+'</span>')+'</span>'
             + '<span class="dwhen mono">'+fmtWhen(r.at)+'</span>'
             + (r.restorable ? '<button class="restore" data-act="restore" data-id="'+r.id+'">restore</button>' : '')
             + '</div>';
      }
      html += '</div><div class="histfoot"><button class="btn subtle" data-act="clear-done">Clear history</button></div>';
    }
  }
  el.innerHTML = html;
  const newBody = document.getElementById("histBody");
  if(newBody) newBody.scrollTop = savedScroll;
}

/* ================================================================
   EVENTS
   ================================================================ */
function onAction(act, el){
  switch(act){
    case "qctx": {
      const id = el.dataset.id;
      const i = quickAddCtx.indexOf(id);
      if(i>=0) quickAddCtx.splice(i,1); else quickAddCtx.push(id);
      renderQuickCtx();   // ephemeral, UI-only selection — no state mutation, no commit()/save() needed
      break;
    }
    case "yes": case "no": case "cant": decide(act); break;
    case "cand-done": decide("cand-done"); break;
    case "bench-done": benchDone(); break;
    case "bench-cant": benchCant(); break;
    case "dislodge": dislodge(); break;
    case "worked": workedOn(); break;
    case "reveal": revealTask(el.dataset.id); break;
    case "continue-scan": pushUndo(); state.interventionActive=false; state.snooze=12; commit(); break;
    case "start-working": pushUndo(); state.interventionActive=false; state.mode="work"; commit(); break;
    case "resume-scan": pushUndo(); state.mode="scan"; state.snooze=6; commit(); break;
    case "start-scan": startScan(); break;
    case "rescan": rescanSkipped(); break;
    case "clear-done": clearCompleted(); openSettings(); break;
    case "new-pass": newPass(); closeModal(); break;
    case "list-tag": toggleListTag(el.dataset.id); break;          // view-only, so no pushUndo/commit — nothing in state changed
    case "clear-list-filters": clearListFilters(); renderList(); break;
    case "toggle-list": state.listOpen=!state.listOpen; render(); save(); break;
    case "toggle-ctx": state.ctxOpen=!state.ctxOpen; render(); save(); break;
    case "toggle-hist": state.histOpen=!state.histOpen; render(); save(); break;
    case "add": {
      const inp=document.getElementById("addInput");
      if(/\r?\n/.test(inp.value)){                      // a whole list got in here
        const {added, skipped, completed} = importList(inp.value, quickAddCtx);
        if(added || skipped || completed){ inp.value=""; toast(importSummary(added, skipped, completed)); }
      }else if(addTask(inp.value,false,quickAddCtx)){ inp.value=""; }
      inp.focus(); break;
    }
    case "add-dot": {
      const inp=document.getElementById("addInput");
      if(addTask(inp.value,true,quickAddCtx)) inp.value="";
      inp.focus(); break;
    }
    case "add-ctx": {
      const name = prompt("New context name:");
      if(name && name.trim()){ pushUndo(); state.contexts.push({id:uid(),name:name.trim(),active:true}); commit(); }
      break;
    }
    case "add-ctx-named": {
      const box=document.getElementById("newCtxName");
      if(box && box.value.trim()){ pushUndo(); state.contexts.push({id:uid(),name:box.value.trim(),active:true}); commit(); openSettings(); }
      break;
    }
    case "del-ctx": {
      pushUndo();
      const id=el.dataset.id;
      state.contexts = state.contexts.filter(c=>c.id!==id);
      for(const t of state.tasks) t.ctx = t.ctx.filter(c=>c!==id);
      commit(); openSettings(); break;
    }
    case "edit": openEdit(el.dataset.id); break;
    case "save-edit": {
      const t=taskById(el.dataset.id); if(!t) break;
      pushUndo();
      applyEditFields(t);
      closeModal(); commit(); break;
    }
    case "done-task": {
      const t=taskById(el.dataset.id); if(!t) break;
      pushUndo();                 // one snapshot covers the save AND the completion,
      applyEditFields(t);         // so a single undo reverses the whole gesture
      doneTask(t.id, false);
      closeModal(); break;
    }
    case "worked-task": {
      const t=taskById(el.dataset.id); if(!t) break;
      pushUndo();                 // same one-snapshot deal as done-task above
      applyEditFields(t);
      workedOnTask(t.id, false);
      closeModal(); break;
    }
    case "dot-task": {
      const t=taskById(el.dataset.id); if(!t) break;
      pushUndo();                 // same one-snapshot deal as done-task/worked-task above
      applyEditFields(t);
      dotTask(t.id, false);
      closeModal(); break;
    }
    case "return-candidate": {
      const t=taskById(el.dataset.id); if(!t || !isSkipped(t)) break;   // button is disabled for this case; guard the call too
      pushUndo();                 // same one-snapshot deal as done-task/worked-task above
      applyEditFields(t);
      returnAsCandidate(t.id, false);
      closeModal(); break;
    }
    case "delete-task": deleteTask(el.dataset.id); closeModal(); break;
    case "restore": {
      const t=taskById(el.dataset.id); if(!t) break;
      pushUndo(); t.done=false; t.completedAt=null; t.lastDoneAt=null;
      // Marks this as a deliberate second run at the task, so finishing it
      // again reads as a real repeat rather than a duplicate to reconcile away.
      t.restoredAt = Date.now();
      recomputeRanks(); commit(); break;
    }
    case "cycle-theme": setTheme(nextTheme()); break;
    case "settings": openSettings(); break;
    case "save-settings": {
      pushUndo();
      const s=state.settings;
      s.horizonMin=Math.max(5,Math.min(480,parseInt(document.getElementById("stHorizon").value)||60));
      s.cantMin=Math.max(5,Math.min(480,parseInt(document.getElementById("stCantMin").value)||30));
      s.workedHours=Math.max(1,Math.min(720,parseInt(document.getElementById("stWorkedHrs").value)||8));
      s.thresholdPct=Math.max(1,Math.min(90,parseInt(document.getElementById("stThresh").value)||25));
      s.samples=Math.max(50,Math.min(2000,parseInt(document.getElementById("stSamples").value)||250));
      recomputeRanks(); closeModal(); commit(); break;
    }
    case "help": openHelp(); break;
    case "close-modal": closeModal(); break;
    case "ok-quickstart": {
      state.seenQuickStart = true;
      closeModal();
      commit();
      break;
    }
    case "import-md": {
      const box=document.getElementById("mdImport"); if(!box) break;
      const {added, skipped, completed} = importList(box.value);
      const msg=document.getElementById("importMsg");
      if(msg){ msg.textContent = importSummary(added, skipped, completed); msg.classList.toggle("warn", !added); }
      if(added) box.value="";
      break;
    }
    case "export-json": {
      const box=document.getElementById("jsonBox");
      box.value=JSON.stringify(state);
      box.focus(); box.select();
      break;
    }
    case "import-json": {
      const box=document.getElementById("jsonBox");
      try{
        const st=JSON.parse(box.value);
        if(!st||!Array.isArray(st.tasks)) throw new Error("bad");
        pushUndo(); state=st; dropRemovedFields(state); hydrateState(state); applyTheme();
        // Pasted in by hand, so it is authoritative as of now — not stale content
        // that cloudPull() should hold this device's writes back over.
        baseUpdatedAt = Date.now();
        recomputeRanks(); closeModal(); commit();
      }catch(e){ alert("That didn\u2019t parse as exported state."); }
      break;
    }
    case "wipe": {
      if(confirm("Delete every task and start over from an empty list?")){
        pushUndo(); state=defaultState(); recomputeRanks(); closeModal(); commit();
      }
      break;
    }
    case "sync": {
      const CS = window.CloudSync;
      if(!CS || !CS.configured) break;
      if(CS.user) CS.signOut(); else CS.signIn();
      break;
    }
    case "undo": undo(); break;
    case "mback": break; // handled in click listener
  }
}

document.addEventListener("click", e=>{
  const back = e.target.classList && e.target.classList.contains("mback");
  if(back){ closeModal(); return; }
  const el = e.target.closest("[data-act]");
  if(!el) return;
  onAction(el.dataset.act, el);
});
document.addEventListener("change", e=>{
  const el = e.target;
  if(!el || !el.matches) return;
  if(el.matches("[data-ctx]")){ toggleContext(el.dataset.ctx); return; }
  if(el.matches("[data-mgrctx]")){ const c=state.contexts.find(c=>c.id===el.dataset.mgrctx); if(c){ pushUndo(); c.active=el.checked; commit(); } return; }
  if(el.matches("[data-mgrname]")){ const c=state.contexts.find(c=>c.id===el.dataset.mgrname); if(c && el.value.trim()){ pushUndo(); c.name=el.value.trim(); commit(); } return; }
});
document.addEventListener("input", e=>{
  const el = e.target;
  if(el && el.id === "listSearch") setListQuery(el.value);
});
document.addEventListener("paste", e=>{
  const t = e.target;
  if(!t || t.id !== "addInput") return;
  const cd = e.clipboardData || window.clipboardData;
  const txt = cd ? cd.getData("text") : "";
  if(!txt || !/\r?\n/.test(txt.trim())) return;      // single line — let it paste normally
  e.preventDefault();
  const {added, skipped, completed} = importList(txt, quickAddCtx);
  if(added || skipped || completed){ t.value = ""; toast(importSummary(added, skipped, completed)); }
});
document.addEventListener("keydown", e=>{
  const t = e.target;
  if(t && t.matches && t.matches("input,textarea,select")){
    if(e.key==="Enter" && t.id==="addInput"){ onAction("add", t); }
    return;
  }
  if(document.querySelector(".mback")){ if(e.key==="Escape") closeModal(); return; }
  const k=e.key.toLowerCase();
  if(k==="y"&&!state.interventionActive&&state.candidateId) decide("yes");   // dot it
  else if(k==="n"&&!state.interventionActive&&state.candidateId) decide("no");
  else if(k==="c"&&!state.interventionActive&&state.candidateId) decide("cant");
  else if(k==="d") hotkeyDone();                                                             // cross off whatever's showing
  else if(k==="w") workedOn();                                                               // worked on it — cross off, back to the bottom
  else if(e.key==="Delete"||e.key==="Backspace"){ e.preventDefault(); hotkeyDelete(); }       // remove it entirely
  else if(k==="u") undo();
});

/* "Done" and "Delete" act on the candidate you're deciding on, if one's showing;
   otherwise they fall back to the benchmark at the head of the chain. */
function hotkeyDone(){
  if(!state.interventionActive && state.mode==="scan" && state.candidateId){ decide("cand-done"); return; }
  benchDone();
}
function hotkeyDelete(){
  if(!state.interventionActive && state.mode==="scan" && state.candidateId){ deleteTask(state.candidateId); return; }
  const b = benchmark();
  if(b) deleteTask(b.id);
}

/* ================================================================
   BOOT
   ================================================================ */
(async function init(){
  const loaded = await loadState();
  state = loaded || defaultState();
  // What this device knew before any edit this session re-stamps updatedAt.
  // cloudPull() arbitrates its first reconcile on this, not on the live value.
  baseUpdatedAt = state.updatedAt || 0;
  dropRemovedFields(state);
  hydrateState(state);
  applyTheme();
  const isFirstBoot = !state.seenQuickStart;
  recomputeRanks();
  ensureCandidate();
  watchOSTheme();
  render();
  if(isFirstBoot) openHelp();
})();
</script>
<script type="module">
/* =====================================================================
   Cloud sync backend — Firebase Auth (Google) + Firestore.
   Exposes window.CloudSync and fires a "cloudsync" event on any change.
   Loads nothing at all until FIREBASE_CONFIG is filled in, so the app
   stays fully functional (and dependency-free) when it isn't.
   ===================================================================== */
const CFG = window.FIREBASE_CONFIG || {};
const configured = !!(CFG.apiKey && CFG.apiKey.indexOf("PASTE") !== 0);
const CS = window.CloudSync = {
  configured, ready:false, user:null, status: configured ? "signed-out" : "off",
  signIn(){}, signOut(){}, async pull(){ return { error:true }; }, async push(){ return { error:true }; }
};
const ping = ()=> window.dispatchEvent(new CustomEvent("cloudsync"));

if(configured){
  try{
    const V = "https://www.gstatic.com/firebasejs/10.12.2/";
    const [appMod, A, F] = await Promise.all([
      import(V+"firebase-app.js"),
      import(V+"firebase-auth.js"),
      import(V+"firebase-firestore.js")
    ]);
    const app  = appMod.initializeApp(CFG);
    const auth = A.getAuth(app);
    const db   = F.getFirestore(app);
    await A.setPersistence(auth, A.browserLocalPersistence);

    const ref = ()=> F.doc(db, "users", auth.currentUser.uid);

    CS.signIn = ()=>{
      CS.status = "syncing"; ping();
      A.signInWithPopup(auth, new A.GoogleAuthProvider())
       .catch(()=>{ CS.status = "error"; ping(); });
    };
    CS.signOut = ()=> A.signOut(auth);

    /* Three distinct answers, because the caller has to tell them apart:
       {payload, updatedAt} — the document, read successfully
       {empty:true}         — we read, and there provably is no document yet
       {error:true}         — the read did not happen, so we learned nothing
       Collapsing the last two into null is what let a stale device "seed"
       an empty cloud that was never empty. See cloudPull(). */
    CS.pull = async ()=>{
      if(!auth.currentUser) return { error:true };
      CS.status = "syncing"; ping();
      try{
        const snap = await F.getDoc(ref());
        CS.status = "ok"; ping();
        return snap.exists() ? snap.data() : { empty:true };
      }catch(e){ CS.status = "error"; ping(); return { error:true }; }
    };
    /* A conditional write, not a blind one. baseRev is the revision the caller
       actually read; the transaction refuses if the document has moved on
       since. Two devices pushing at once used to mean the second silently
       replaced the first — with setDoc there was nothing to notice it. The
       caller treats a conflict as "go and reconcile", never as "try harder".
       Returns {ok:true, rev} | {conflict:true, rev} | {error:true}. */
    CS.push = async (payload, updatedAt, baseRev)=>{
      if(!auth.currentUser) return { error:true };
      CS.status = "syncing"; ping();
      try{
        const res = await F.runTransaction(db, async (tx)=>{
          const snap = await tx.get(ref());
          const cur  = snap.exists() ? (snap.data().rev || 0) : 0;
          if(snap.exists() && typeof baseRev === "number" && cur !== baseRev){
            return { conflict:true, rev:cur };
          }
          const next = cur + 1;
          tx.set(ref(), { payload, updatedAt, rev: next });
          return { ok:true, rev: next };
        });
        CS.status = "ok"; ping();
        return res;
      }catch(e){ CS.status = "error"; ping(); return { error:true }; }
    };

    A.onAuthStateChanged(auth, u=>{
      CS.user   = u ? (u.email || u.uid) : null;
      CS.status = u ? "ok" : "signed-out";
      CS.ready  = true;
      ping();
      if(u && window.cloudPull) window.cloudPull();   // reconcile once, right after signing in / session restore
    });
  }catch(e){
    CS.configured = false; CS.status = "error"; ping();
  }
}
ping();
</script>
