name: Diagnostic mobile frame phases (nonmergeable)
on:
  push:
    branches: [diagnose/webkit-action-phases]
permissions:
  contents: read
jobs:
  diagnostic-mobile-frame:
    name: diagnostic-required-1GB-${{ matrix.motion }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        motion: [normal, reduced]
    env:
      CHAIN_TEST_EVENT_POLICY: outgoing-branch-push-v1
      CHAIN_TEST_SOURCE_SHA: ${{ github.sha }}
      CHAIN_DIAGNOSTIC_MOTION: ${{ matrix.motion }}
      FROZEN_APP_COMMIT: '937975d4bc09d3e539f796621b4d8e00f4a91408'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - name: Bind frozen app bytes and separate diagnostic runner identity
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import{execFileSync}from'node:child_process';import{createHash}from'node:crypto';import assert from'node:assert/strict';
          const git=(...args)=>execFileSync('git',args,{maxBuffer:32*1024*1024}),hash=bytes=>createHash('sha256').update(bytes).digest('hex'),base=process.env.FROZEN_APP_COMMIT,inventory=JSON.parse(fs.readFileSync('scripts/button-safety-inventory.json'));
          const assets=git('ls-files').toString().trim().split('\n').filter(file=>file!=='tests.js'&&!file.startsWith('scripts/')&&(/\.(html|js|css|svg|png|webmanifest)$/.test(file)||Object.hasOwn(inventory.requiredRuntimeAssets,file)));
          const rows=assets.map(file=>{const expected=hash(git('show',base+':'+file)),actual=hash(fs.readFileSync(file));assert.equal(actual,expected,'Frozen application asset '+file);return{file,sha256:actual};});
          const report={kind:'diagnostic-only-source-binding',frozenAppCommit:base,diagnosticCommit:git('rev-parse','HEAD').toString().trim(),diagnosticTree:git('rev-parse','HEAD^{tree}').toString().trim(),workflowBlob:git('rev-parse','HEAD:.github/workflows/data-safety.yml').toString().trim(),motion:process.env.CHAIN_DIAGNOSTIC_MOTION,assets:rows,originalUninstrumentedControl:{runId:'40356760855',sourceSha:'3781d21b3e2592d0942ca80eeabbebea44557809',tree:'651a52d185175417b8e403ae2cf36e24af96c620',requiredNormalGapMs:1431,requiredNormalPeakBytes:913702912,oomKills:0}};
          fs.mkdirSync(process.env.RUNNER_TEMP+'/mobile-frame',{recursive:true});fs.writeFileSync(process.env.RUNNER_TEMP+'/mobile-frame/source-binding.json',JSON.stringify(report,null,2)+'\n');
          JS
      - name: Fresh real capped control and original full story with bounded phase observer
        run: node scripts/button-safety-mobile-memory.mjs --run --profile required-1gb --output-dir "$RUNNER_TEMP/mobile-frame/capped"
      - name: Preserve actual outcome and owned cleanup without canonical aggregation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-mobile-frame-${{ matrix.motion }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mobile-frame
          if-no-files-found: error

  diagnostic-native-focused:
    name: diagnostic-uncapped-four-native-consumers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHAIN_TEST_EVENT_POLICY: outgoing-branch-push-v1
      CHAIN_TEST_SOURCE_SHA: ${{ github.sha }}
      CHAIN_DIAGNOSTIC_MOTION: uncapped-focused
      FROZEN_APP_COMMIT: '937975d4bc09d3e539f796621b4d8e00f4a91408'
      CHAIN_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/mobile-frame/native-focused
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - name: Install only the locked matching native engines
        run: npx playwright install --with-deps chromium webkit
      - name: Bind frozen app bytes and separate diagnostic runner identity
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import{execFileSync}from'node:child_process';import{createHash}from'node:crypto';import assert from'node:assert/strict';
          const git=(...args)=>execFileSync('git',args,{maxBuffer:32*1024*1024}),hash=bytes=>createHash('sha256').update(bytes).digest('hex'),base=process.env.FROZEN_APP_COMMIT,inventory=JSON.parse(fs.readFileSync('scripts/button-safety-inventory.json'));
          const assets=git('ls-files').toString().trim().split('\n').filter(file=>file!=='tests.js'&&!file.startsWith('scripts/')&&(/\.(html|js|css|svg|png|webmanifest)$/.test(file)||Object.hasOwn(inventory.requiredRuntimeAssets,file)));
          const rows=assets.map(file=>{const expected=hash(git('show',base+':'+file)),actual=hash(fs.readFileSync(file));assert.equal(actual,expected,'Frozen application asset '+file);return{file,sha256:actual};});
          const report={kind:'diagnostic-only-source-binding',frozenAppCommit:base,diagnosticCommit:git('rev-parse','HEAD').toString().trim(),diagnosticTree:git('rev-parse','HEAD^{tree}').toString().trim(),workflowBlob:git('rev-parse','HEAD:.github/workflows/data-safety.yml').toString().trim(),motion:process.env.CHAIN_DIAGNOSTIC_MOTION,assets:rows,originalUninstrumentedControl:{runId:'40356760855',sourceSha:'3781d21b3e2592d0942ca80eeabbebea44557809',tree:'651a52d185175417b8e403ae2cf36e24af96c620',requiredNormalGapMs:1431,requiredNormalPeakBytes:913702912,oomKills:0}};
          fs.mkdirSync(process.env.RUNNER_TEMP+'/mobile-frame',{recursive:true});fs.writeFileSync(process.env.RUNNER_TEMP+'/mobile-frame/source-binding.json',JSON.stringify(report,null,2)+'\n');
          JS
      - name: Diagnose only the four existing failed consumers with original assertions
        run: node scripts/diagnostic-native-phases.mjs
      - name: Preserve original native outcomes and bounded protocol phases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-native-focused-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mobile-frame
          if-no-files-found: error
