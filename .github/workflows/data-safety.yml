name: Data safety

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Equivalent PR events serialize admission; a metadata edit cannot cancel the
# admitted producer. Routing still verifies its exact durable context/outcome.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CHAIN_CI_TOPOLOGY: four-groups-v1
  CHAIN_TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validation-context:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.diff-base.outputs.sha }}
      context: ${{ steps.plan.outputs.context }}
      policy: ${{ steps.plan.outputs.policy }}
      tree: ${{ steps.plan.outputs.tree }}
      workflow-blob: ${{ steps.plan.outputs.workflow-blob }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject nonqualifying diagnostic source
        shell: bash
        run: |
          if git cat-file -e HEAD:.diagnostic-task.json 2>/dev/null; then
            echo "nonqualifying diagnostic source: ordinary product qualification is unavailable; use supported diagnostic workflow" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve comparison base
        id: diff-base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$PR_BASE_SHA" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags origin main
            base="$(git merge-base origin/main "$HEAD_SHA")"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$base^{commit}"; then
            echo "Could not resolve a commit to compare against." >&2
            exit 1
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Describe required cohort
        run: npm run test:group -- --describe --group core --output-dir "$RUNNER_TEMP/descriptor" --repository "$GITHUB_REPOSITORY" --event-policy "$GITHUB_EVENT_NAME" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$CHAIN_TEST_SOURCE_SHA" --comparison-base "${{ steps.diff-base.outputs.sha }}"
      - name: Bind exact validation context
        id: plan
        run: node scripts/agent-tools/ci-routing.mjs --plan-only 1 --descriptor "$RUNNER_TEMP/descriptor/descriptor.json" --comparison-base "${{ steps.diff-base.outputs.sha }}" --evidence-dir "$RUNNER_TEMP/context"
      - name: Actual checkout ${{ github.sha }} tree ${{ steps.plan.outputs.tree }}
        run: git rev-parse HEAD
      - name: Validation source ${{ env.CHAIN_TEST_SOURCE_SHA }} base ${{ steps.diff-base.outputs.sha }}
        run: git cat-file -e "$CHAIN_TEST_SOURCE_SHA^{commit}"
      - name: Workflow blob ${{ steps.plan.outputs.workflow-blob }} policy four-groups-v1
        run: git rev-parse HEAD:.github/workflows/data-safety.yml
      - name: Announce regression context ${{ steps.plan.outputs.context }}
        run: echo "Bound source, checkout, comparison and complete cohort before execution"
      - name: Preserve validation context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/descriptor
            ${{ runner.temp }}/context
          if-no-files-found: error

  event-gates:
    needs: [validation-context, cohort-routing, early-startup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        if: needs.cohort-routing.outputs.decision != 'policy-reuse'
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        if: needs.cohort-routing.outputs.decision != 'policy-reuse'
      - run: node scripts/test-first-gate.mjs "${{ needs.validation-context.outputs.base }}"
      - run: npm run test:rules
        if: needs.cohort-routing.outputs.decision != 'policy-reuse'
      - name: Backward compatibility
        if: needs.cohort-routing.outputs.decision != 'policy-reuse'
        env:
          COMPATIBILITY_BASE_SHA: ${{ needs.validation-context.outputs.base }}
        run: npm run test:compatibility

  cohort-routing:
    needs: validation-context
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.route.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: validation-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation
      - name: Resolve complete cohort coverage
        id: route
        run: node scripts/agent-tools/ci-routing.mjs --descriptor "$RUNNER_TEMP/validation/descriptor/descriptor.json" --comparison-base "${{ needs.validation-context.outputs.base }}" --evidence-dir "$RUNNER_TEMP/ci-routing"
      - name: Admit original full producer context ${{ needs.validation-context.outputs.context }}
        if: success() && steps.route.outputs.decision == 'full'
        run: echo "Original complete cohort admitted; references never emit this marker"
      - name: Preserve routing observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-routing
          if-no-files-found: error

  early-startup:
    needs: [validation-context, cohort-routing]
    runs-on: ubuntu-latest
    env:
      CHAIN_TEST_EVENT_POLICY: ${{ needs.validation-context.outputs.policy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: validation-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation
      - uses: actions/download-artifact@v4
        with:
          name: ci-routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-routing
      - run: npm ci
        if: needs.cohort-routing.outputs.decision == 'full'
      - name: Install matching harness engines
        if: needs.cohort-routing.outputs.decision == 'full'
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Required saved harness and populated mobile startup
        id: early
        if: needs.cohort-routing.outputs.decision == 'full'
        run: node scripts/early-ci.mjs --run --descriptor "$RUNNER_TEMP/validation/descriptor/descriptor.json" --output-dir "$RUNNER_TEMP/early"
      - name: Record exact original early producer coverage
        if: contains(fromJSON('["reuse","policy-reuse"]'), needs.cohort-routing.outputs.decision)
        run: node scripts/early-ci.mjs --covered --descriptor "$RUNNER_TEMP/validation/descriptor/descriptor.json" --output-dir "$RUNNER_TEMP/early" --proof "$RUNNER_TEMP/ci-routing/routing.json"
      - name: Preserve immutable early evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/early
          if-no-files-found: error
      - name: Complete early startup report ${{ steps.early.outputs.report }}
        if: success() && needs.cohort-routing.outputs.decision == 'full'
        run: echo "Original harness and required one GB story completed"

  mobile-stress:
    needs: [validation-context, cohort-routing, early-startup]
    runs-on: ubuntu-latest
    env:
      CHAIN_TEST_EVENT_POLICY: ${{ needs.validation-context.outputs.policy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        if: needs.cohort-routing.outputs.decision == 'full'
      - name: Report 512MB application stress with required execution integrity
        if: needs.cohort-routing.outputs.decision == 'full'
        run: node scripts/button-safety-mobile-memory.mjs --run --profile stress-512mb --output-dir "$RUNNER_TEMP/stress"
      - uses: actions/upload-artifact@v4
        if: always() && needs.cohort-routing.outputs.decision == 'full'
        with:
          name: mobile-stress-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stress
          if-no-files-found: error

  regression:
    name: regression-${{ matrix.group }}
    needs: [validation-context, cohort-routing, early-startup]
    if: always() && needs.validation-context.result == 'success' && needs.cohort-routing.result == 'success' && needs.early-startup.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [core, scenery, persistence-recovery, native-process]
    env:
      CHAIN_TEST_EVENT_POLICY: ${{ needs.validation-context.outputs.policy }}
      CHAIN_TEST_COMPARISON_BASE: ${{ needs.validation-context.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        if: needs.cohort-routing.outputs.decision == 'full'
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        if: needs.cohort-routing.outputs.decision == 'full'
      - name: Install matching native Chromium
        if: needs.cohort-routing.outputs.decision == 'full'
        run: npx --no-install playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        if: contains(fromJSON('["reuse","policy-reuse"]'), needs.cohort-routing.outputs.decision)
        with:
          name: ci-routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-routing
      - uses: actions/download-artifact@v4
        with:
          name: early-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/early
      - name: Execute complete assigned group
        if: needs.cohort-routing.outputs.decision == 'full'
        run: npm run test:group -- --group "${{ matrix.group }}" --early-receipt "$RUNNER_TEMP/early/receipt.json" --output-dir "$RUNNER_TEMP/group" --repository "$GITHUB_REPOSITORY" --event-policy "$CHAIN_TEST_EVENT_POLICY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$CHAIN_TEST_SOURCE_SHA" --comparison-base "$CHAIN_TEST_COMPARISON_BASE"
      - name: Record verified full-producer coverage reference
        if: contains(fromJSON('["reuse","policy-reuse"]'), needs.cohort-routing.outputs.decision)
        run: npm run test:group -- --covered --proof "$RUNNER_TEMP/ci-routing/routing.json" --group "${{ matrix.group }}" --early-receipt "$RUNNER_TEMP/early/receipt.json" --output-dir "$RUNNER_TEMP/group" --repository "$GITHUB_REPOSITORY" --event-policy "$CHAIN_TEST_EVENT_POLICY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$CHAIN_TEST_SOURCE_SHA" --comparison-base "$CHAIN_TEST_COMPARISON_BASE"
      - name: Preserve actual group results and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group }}
          path: ${{ runner.temp }}/group
          if-no-files-found: error

  scanner-tests:
    needs: [validation-context, event-gates, cohort-routing, early-startup, regression, mobile-stress]
    if: always()
    runs-on: ubuntu-latest
    env:
      CHAIN_TEST_EVENT_POLICY: ${{ needs.validation-context.outputs.policy }}
      CHAIN_TEST_COMPARISON_BASE: ${{ needs.validation-context.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retain actual predecessor outcomes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP+"/needs.json",process.env.NEEDS_JSON)'
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: validation-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: regression-${{ github.run_id }}-${{ github.run_attempt }}-core
          path: ${{ runner.temp }}/groups/core
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: regression-${{ github.run_id }}-${{ github.run_attempt }}-scenery
          path: ${{ runner.temp }}/groups/scenery
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: regression-${{ github.run_id }}-${{ github.run_attempt }}-persistence-recovery
          path: ${{ runner.temp }}/groups/persistence-recovery
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: regression-${{ github.run_id }}-${{ github.run_attempt }}-native-process
          path: ${{ runner.temp }}/groups/native-process
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: early-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/early
      - uses: actions/download-artifact@v4
        if: needs.cohort-routing.outputs.decision == 'full'
        with:
          name: mobile-stress-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stress
      - name: Recheck covered producer immediately before aggregation
        if: contains(fromJSON('["reuse","policy-reuse"]'), needs.cohort-routing.outputs.decision)
        run: node scripts/agent-tools/ci-routing.mjs --max-wait-ms 0 --descriptor "$RUNNER_TEMP/validation/descriptor/descriptor.json" --comparison-base "$CHAIN_TEST_COMPARISON_BASE" --evidence-dir "$RUNNER_TEMP/final-routing"
      - name: Verify complete required cohort
        id: aggregate
        if: always()
        run: |
          npm run test:group -- --aggregate --group core --output-dir "$RUNNER_TEMP/aggregate" --results-dir "$RUNNER_TEMP/groups" --needs-json "$RUNNER_TEMP/needs.json" --early-receipt "$RUNNER_TEMP/early/receipt.json" --mobile-stress-report "$RUNNER_TEMP/stress/report.json" --proof "$RUNNER_TEMP/final-routing/routing.json" --repository "$GITHUB_REPOSITORY" --event-policy "$CHAIN_TEST_EVENT_POLICY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$CHAIN_TEST_SOURCE_SHA" --comparison-base "$CHAIN_TEST_COMPARISON_BASE"
      - name: Preserve verified aggregate and final observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aggregate
            ${{ runner.temp }}/final-routing
          if-no-files-found: error
      - name: Verified complete cohort ${{ needs.validation-context.outputs.context }} report ${{ steps.aggregate.outputs.report }} mode ${{ needs.cohort-routing.outputs.decision }}
        if: success()
        run: echo "Required current execution or original producer coverage verified"
      - name: Complete regression context ${{ needs.validation-context.outputs.context }} report ${{ steps.aggregate.outputs.report }}
        if: success() && needs.cohort-routing.outputs.decision == 'full'
        run: echo "Every required group, outcome, raw hash, native report and gate reconciled"

  release-evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact-SHA risk-based review evidence for the deployed commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-evidence.mjs verify-deployment "${{ github.sha }}" "${{ github.event.before }}"

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [scanner-tests, release-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: mkdir site
      - run: git archive HEAD | tar -x -C site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
