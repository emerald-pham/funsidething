# NONMERGEABLE: temporary startup investigation, never release qualification.
name: NONMERGEABLE WebKit cap diagnosis
on:
  push:
    branches: [diagnose/webkit-cap-31c]
permissions:
  contents: read
jobs:
  diagnostic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CHAIN_TEST_EVENT_POLICY: outgoing-branch-push-v1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Diagnostic process contracts only
        run: |
          node --test --test-name-pattern='^RISK repository process: nonmergeable mobile startup diagnostics preserve strict caps and independent controls$' tests.js
      - name: Seven capped observations, never acceptance
        run: node scripts/button-safety-mobile-diagnostic.mjs --run --output-dir "$RUNNER_TEMP/webkit-cap-diagnosis"
      - name: Preserve every observed failure and phase
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NONMERGEABLE-webkit-cap-diagnosis-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/webkit-cap-diagnosis
          if-no-files-found: error
