name: Data safety

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# Equivalent PR events serialize admission; a metadata edit cannot cancel the
# admitted producer. Routing still verifies its exact durable context/outcome.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CHAIN_CI_TOPOLOGY: four-groups-v1
  CHAIN_TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validation-context:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.diff-base.outputs.sha }}
      context: ${{ steps.plan.outputs.context }}
      policy: ${{ steps.plan.outputs.policy }}
      tree: ${{ steps.plan.outputs.tree }}
      workflow-blob: ${{ steps.plan.outputs.workflow-blob }}
      input-keys: ${{ steps.plan.outputs.input-keys }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject nonqualifying diagnostic source
        shell: bash
        run: |
          if git cat-file -e HEAD:.diagnostic-task.json 2>/dev/null; then
            echo "nonqualifying diagnostic source: ordinary product qualification is unavailable; use supported diagnostic workflow" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned workflow validator
        run: npm run agent:setup-workflow-validator
      - name: Validate pinned workflow checkout
        id: workflow-validation
        run: npm run agent:validate-workflows -- --source-label "GitHub checkout ${GITHUB_SHA}" --evidence-file "${RUNNER_TEMP}/workflow-validation.json"
      - name: Preserve workflow validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workflow-validation.json
          if-no-files-found: ignore
      - name: Enforce CI reuse contract
        run: node --test --test-name-pattern='^workflow input reuse retains large original native evidence and rejects changed bytes$|^test group workflow consumer forbids duplicate execution for a verified input pass$|^workflow emulator gate reuses a verified pass and executes an uncovered gate$|^workflow reuses an independently passed gate on main for the same complete inputs$|^workflow partial retries preserve successful gates and invalidate a later failed execution$|^test group aggregate preserves observer protocol across emulator coverage and fresh fallback$' scripts/agent-tools/test-groups.test.mjs scripts/agent-tools/ci-routing.test.mjs
      - name: Resolve comparison base
        id: diff-base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$PR_BASE_SHA" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags origin main
            base="$(git merge-base origin/main "$HEAD_SHA")"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$base^{commit}"; then
            echo "Could not resolve a commit to compare against." >&2
            exit 1
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Describe required cohort
        run: npm run test:group -- --describe --group core --output-dir "$RUNNER_TEMP/descriptor" --repository "$GITHUB_REPOSITORY" --event-policy "$GITHUB_EVENT_NAME" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$CHAIN_TEST_SOURCE_SHA" --comparison-base "${{ steps.diff-base.outputs.sha }}"
      - name: Bind exact validation context
        id: plan
        run: node scripts/agent-tools/ci-routing.mjs --plan-only 1 --descriptor "$RUNNER_TEMP/descriptor/descriptor.json" --comparison-base "${{ steps.diff-base.outputs.sha }}" --evidence-dir "$RUNNER_TEMP/context"
      - name: Actual checkout ${{ github.sha }} tree ${{ steps.plan.outputs.tree }}
        run: git rev-parse HEAD
      - name: Validation source ${{ env.CHAIN_TEST_SOURCE_SHA }} base ${{ steps.diff-base.outputs.sha }}
        run: git cat-file -e "$CHAIN_TEST_SOURCE_SHA^{commit}"
      - name: Workflow blob ${{ steps.plan.outputs.workflow-blob }} policy four-groups-v1
        run: git rev-parse HEAD:.github/workflows/data-safety.yml
      - name: Announce regression context ${{ steps.plan.outputs.context }}
        run: echo "Bound source, checkout, comparison and complete cohort before execution"
      - name: Preserve validation context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/descriptor
            ${{ runner.temp }}/context
          if-no-files-found: error

  event-gates:
    needs: [validation-context, cohort-routing, early-startup]
    runs-on: ubuntu-latest
    outputs:
      rules: ${{ steps.rules.outputs.mode }}
      compatibility: ${{ steps.compatibility.outputs.mode }}
      rules-coverage: ${{ steps.rules.outputs.coverage }}
      compatibility-coverage: ${{ steps.compatibility.outputs.coverage }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: ci-routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-routing
      - name: Select coverage for this runner
        id: selected
        run: node scripts/agent-tools/ci-pass-reuse.mjs select --proof "$RUNNER_TEMP/ci-routing/routing.json" --output-file "$RUNNER_TEMP/selected-routing/routing.json"
      - uses: actions/setup-java@v4
        if: ${{ steps.selected.outputs.decision != 'policy-reuse' && (!contains(fromJSON(steps.selected.outputs.reused), 'rules') || !contains(fromJSON(steps.selected.outputs.reused), 'compatibility')) }}
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        if: ${{ steps.selected.outputs.decision != 'policy-reuse' && (!contains(fromJSON(steps.selected.outputs.reused), 'rules') || !contains(fromJSON(steps.selected.outputs.reused), 'compatibility')) }}
      - run: node scripts/test-first-gate.mjs "${{ needs.validation-context.outputs.base }}"
      - name: Execute CI gate rules input ${{ fromJSON(steps.selected.outputs.input-keys).rules }}
        if: ${{ steps.selected.outputs.decision != 'policy-reuse' && !contains(fromJSON(steps.selected.outputs.reused), 'rules') }}
        run: echo "Executing previously uncovered rules inputs"
      - name: Firestore rules or verified original pass
        id: rules
        if: steps.selected.outputs.decision != 'policy-reuse'
        run: node scripts/agent-tools/ci-pass-reuse.mjs run-gate --gate rules --proof "$RUNNER_TEMP/selected-routing/routing.json" --output-dir "$RUNNER_TEMP/emulator-gates/rules" --comparison-base "${{ needs.validation-context.outputs.base }}"
      - name: Execute CI gate compatibility input ${{ fromJSON(steps.selected.outputs.input-keys).compatibility }}
        if: ${{ steps.selected.outputs.decision != 'policy-reuse' && !contains(fromJSON(steps.selected.outputs.reused), 'compatibility') }}
        run: echo "Executing previously uncovered compatibility inputs"
      - name: Backward compatibility
        id: compatibility
        if: steps.selected.outputs.decision != 'policy-reuse'
        env:
          COMPATIBILITY_BASE_SHA: ${{ needs.validation-context.outputs.base }}
        run: node scripts/agent-tools/ci-pass-reuse.mjs run-gate --gate compatibility --proof "$RUNNER_TEMP/selected-routing/routing.json" --output-dir "$RUNNER_TEMP/emulator-gates/compatibility" --comparison-base "${{ needs.validation-context.outputs.base }}"
      - name: Preserve emulator gate evidence
        id: upload
        if: always() && steps.selected.outputs.decision != 'policy-reuse'
        uses: actions/upload-artifact@v4
        with:
          name: event-gates-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/emulator-gates
          if-no-files-found: error
      - name: Completed CI gate rules input ${{ steps.rules.outputs.key }} result ${{ steps.rules.outputs.result }}
        if: always() && steps.rules.outputs.mode == 'executed' && steps.rules.outputs.key != '' && steps.upload.outcome == 'success'
        run: echo "Original rules execution and retained result verified"
      - name: Completed CI gate compatibility input ${{ steps.compatibility.outputs.key }} result ${{ steps.compatibility.outputs.result }}
        if: always() && steps.compatibility.outputs.mode == 'executed' && steps.compatibility.outputs.key != '' && steps.upload.outcome == 'success'
        run: echo "Original compatibility execution and retained result verified"

  cohort-routing:
    needs: validation-context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      decision: ${{ steps.route.outputs.decision }}
      reused: ${{ steps.route.outputs.reused }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: validation-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation
      - name: Resolve complete cohort coverage
        id: route
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/agent-tools/ci-routing.mjs --require-input-passes 1 --descriptor "$RUNNER_TEMP/validation/descriptor/descriptor.json" --comparison-base "${{ needs.validation-context.outputs.base }}" --evidence-dir "$RUNNER_TEMP/ci-routing"
      - name: Admit original full producer context ${{ needs.validation-context.outputs.context }}
        if: success() && steps.route.outputs.decision == 'full'
        run: echo "Original complete cohort admitted; references never emit this marker"
      - name: Preserve routing observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-routing
          if-no-files-found: error

  early-startup:
    needs: [validation-context, cohort-routing]
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.selected.outputs.early-decision }}
    env:
      CHAIN_TEST_EVENT_POLICY: ${{ needs.validation-context.outputs.policy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Admit immutable saved scenery fixture object
        run: |
          git cat-file -e 'b176026825e4f9539780f745fe60e09cf348d288^{commit}' || git fetch --no-tags origin b176026825e4f9539780f745fe60e09cf348d288
          test "$(git rev-parse 'b176026825e4f9539780f745fe60e09cf348d288^{tree}')" = 27e293d0fa9aae62a906b36dc984bd0ef184f956
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: validation-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation
      - uses: actions/download-artifact@v4
        with:
          name: ci-routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-routing
      - name: Select early coverage for this runner
        id: selected
        run: node scripts/agent-tools/ci-pass-reuse.mjs select --proof "$RUNNER_TEMP/ci-routing/routing.json" --output-file "$RUNNER_TEMP/selected-routing/routing.json"
      - run: npm ci
        if: steps.selected.outputs.early-decision == 'full'
      - name: Install matching harness engines
        if: steps.selected.outputs.early-decision == 'full'
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Required saved harness and populated mobile startup
        id: early
        if: steps.selected.outputs.early-decision == 'full'
        run: node scripts/early-ci.mjs --run --descriptor "$RUNNER_TEMP/validation/descriptor/descriptor.json" --output-dir "$RUNNER_TEMP/early"
      - name: Record exact original early producer coverage
        if: contains(fromJSON('["reuse","policy-reuse"]'), steps.selected.outputs.early-decision)
        run: node scripts/early-ci.mjs --covered --descriptor "$RUNNER_TEMP/validation/descriptor/descriptor.json" --output-dir "$RUNNER_TEMP/early" --proof "$RUNNER_TEMP/selected-routing/routing.json"
      - name: Preserve immutable early evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/early
          if-no-files-found: error
      - name: Complete early startup report ${{ steps.early.outputs.report }}
        if: success() && steps.selected.outputs.early-decision == 'full'
        run: echo "Original harness and required one GB story completed"

  mobile-stress:
    needs: [validation-context, cohort-routing, early-startup]
    runs-on: ubuntu-latest
    env:
      CHAIN_TEST_EVENT_POLICY: ${{ needs.validation-context.outputs.policy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        if: needs.early-startup.outputs.decision == 'full'
      - name: Report 512MB application stress with required execution integrity
        if: needs.early-startup.outputs.decision == 'full'
        run: node scripts/button-safety-mobile-memory.mjs --run --profile stress-512mb --output-dir "$RUNNER_TEMP/stress"
      - uses: actions/upload-artifact@v4
        if: always() && needs.early-startup.outputs.decision == 'full'
        with:
          name: mobile-stress-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stress
          if-no-files-found: error

  regression:
    name: regression-${{ matrix.group }}
    needs: [validation-context, cohort-routing, early-startup]
    if: always() && needs.validation-context.result == 'success' && needs.cohort-routing.result == 'success' && needs.early-startup.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [core, scenery, persistence-recovery, native-process]
    env:
      CHAIN_TEST_EVENT_POLICY: ${{ needs.validation-context.outputs.policy }}
      CHAIN_TEST_COMPARISON_BASE: ${{ needs.validation-context.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Admit immutable saved scenery fixture object
        run: |
          git cat-file -e 'b176026825e4f9539780f745fe60e09cf348d288^{commit}' || git fetch --no-tags origin b176026825e4f9539780f745fe60e09cf348d288
          test "$(git rev-parse 'b176026825e4f9539780f745fe60e09cf348d288^{tree}')" = 27e293d0fa9aae62a906b36dc984bd0ef184f956
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: ci-routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-routing
      - name: Select coverage for this runner
        id: selected
        run: node scripts/agent-tools/ci-pass-reuse.mjs select --proof "$RUNNER_TEMP/ci-routing/routing.json" --output-file "$RUNNER_TEMP/selected-routing/routing.json"
      - uses: actions/setup-java@v4
        if: steps.selected.outputs.decision == 'full' && !contains(fromJSON(steps.selected.outputs.reused), matrix.group)
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        if: steps.selected.outputs.decision == 'full' && !contains(fromJSON(steps.selected.outputs.reused), matrix.group)
      - name: Install matching native Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        if: steps.selected.outputs.decision == 'full' && !contains(fromJSON(steps.selected.outputs.reused), matrix.group)
        run: |
          engines=(chromium)
          if [[ "${{ matrix.group }}" == "native-process" ]] && [[ "${{ steps.selected.outputs.early-decision }}" == "reuse" ]]; then
            engines+=(webkit)
          fi
          npx --no-install playwright install --with-deps "${engines[@]}"
      - name: Execute CI gate ${{ matrix.group }} input ${{ fromJSON(steps.selected.outputs.input-keys)[matrix.group] }}
        if: steps.selected.outputs.decision == 'full' && !contains(fromJSON(steps.selected.outputs.reused), matrix.group)
        run: echo "Executing previously uncovered group inputs"
      - uses: actions/download-artifact@v4
        with:
          name: validation-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation
      - uses: actions/download-artifact@v4
        with:
          name: early-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/early
      - name: Execute complete assigned group
        id: group
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: |
          group_args=(--group "${{ matrix.group }}" --descriptor "$RUNNER_TEMP/validation/descriptor/descriptor.json" --early-receipt "$RUNNER_TEMP/early/receipt.json")
          if [[ "${{ matrix.group }}" == "persistence-recovery" ]]; then
            group_args+=(--browser-path "$PLAYWRIGHT_BROWSERS_PATH")
          fi
          node scripts/agent-tools/ci-pass-reuse.mjs run-group "${group_args[@]}" --proof "$RUNNER_TEMP/selected-routing/routing.json" --output-dir "$RUNNER_TEMP/group" --repository "$GITHUB_REPOSITORY" --event-policy "$CHAIN_TEST_EVENT_POLICY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$CHAIN_TEST_SOURCE_SHA" --comparison-base "$CHAIN_TEST_COMPARISON_BASE"
      - name: Preserve actual group results and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group }}
          path: ${{ runner.temp }}/group
          if-no-files-found: error
      - name: Completed CI gate ${{ matrix.group }} input ${{ steps.group.outputs.key }} result ${{ steps.group.outputs.result }}
        if: success() && steps.group.outputs.mode == 'executed' && steps.group.outputs.key != ''
        run: echo "Original group execution and retained result verified"

  scanner-tests:
    needs: [validation-context, event-gates, cohort-routing, early-startup, regression, mobile-stress]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      CHAIN_TEST_EVENT_POLICY: ${{ needs.validation-context.outputs.policy }}
      CHAIN_TEST_COMPARISON_BASE: ${{ needs.validation-context.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Admit immutable saved scenery fixture object
        run: |
          git cat-file -e 'b176026825e4f9539780f745fe60e09cf348d288^{commit}' || git fetch --no-tags origin b176026825e4f9539780f745fe60e09cf348d288
          test "$(git rev-parse 'b176026825e4f9539780f745fe60e09cf348d288^{tree}')" = 27e293d0fa9aae62a906b36dc984bd0ef184f956
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retain actual predecessor outcomes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP+"/needs.json",process.env.NEEDS_JSON)'
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: validation-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: regression-${{ github.run_id }}-${{ github.run_attempt }}-core
          path: ${{ runner.temp }}/groups/core
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: regression-${{ github.run_id }}-${{ github.run_attempt }}-scenery
          path: ${{ runner.temp }}/groups/scenery
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: regression-${{ github.run_id }}-${{ github.run_attempt }}-persistence-recovery
          path: ${{ runner.temp }}/groups/persistence-recovery
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: regression-${{ github.run_id }}-${{ github.run_attempt }}-native-process
          path: ${{ runner.temp }}/groups/native-process
      - uses: actions/download-artifact@v4
        with:
          name: ci-routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-routing
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: early-startup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/early
      - uses: actions/download-artifact@v4
        if: needs.early-startup.outputs.decision == 'full'
        with:
          name: mobile-stress-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stress
      - name: Recheck covered producer immediately before aggregation
        if: contains(fromJSON('["reuse","policy-reuse"]'), needs.cohort-routing.outputs.decision) || needs.cohort-routing.outputs.reused != '[]' || needs.early-startup.outputs.decision == 'reuse'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/agent-tools/ci-routing.mjs --require-input-passes 1 --input-proof "$RUNNER_TEMP/ci-routing/routing.json" --max-wait-ms 0 --descriptor "$RUNNER_TEMP/validation/descriptor/descriptor.json" --comparison-base "$CHAIN_TEST_COMPARISON_BASE" --evidence-dir "$RUNNER_TEMP/final-routing"
      - name: Verify complete required cohort
        id: aggregate
        if: always()
        run: |
          npm run test:group -- --aggregate --group core --descriptor "$RUNNER_TEMP/validation/descriptor/descriptor.json" --output-dir "$RUNNER_TEMP/aggregate" --results-dir "$RUNNER_TEMP/groups" --needs-json "$RUNNER_TEMP/needs.json" --early-receipt "$RUNNER_TEMP/early/receipt.json" --mobile-stress-report "$RUNNER_TEMP/stress/report.json" --proof "$RUNNER_TEMP/final-routing/routing.json" --repository "$GITHUB_REPOSITORY" --event-policy "$CHAIN_TEST_EVENT_POLICY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$CHAIN_TEST_SOURCE_SHA" --comparison-base "$CHAIN_TEST_COMPARISON_BASE"
      - name: Preserve verified aggregate and final observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aggregate
            ${{ runner.temp }}/final-routing
          if-no-files-found: error
      - name: Verified complete cohort ${{ needs.validation-context.outputs.context }} report ${{ steps.aggregate.outputs.report }} mode ${{ steps.aggregate.outputs.attestation-mode }}
        if: success()
        run: echo "Required current execution or original producer coverage verified"
      - name: Complete regression context ${{ needs.validation-context.outputs.context }} report ${{ steps.aggregate.outputs.report }}
        if: success() && steps.aggregate.outputs.original == 'true'
        run: echo "Every required group, outcome, raw hash, native report and gate reconciled"

  release-evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact-SHA risk-based review evidence for the deployed commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-evidence.mjs verify-deployment "${{ github.sha }}" "${{ github.event.before }}"

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [scanner-tests, release-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: mkdir site
      - run: git archive HEAD | tar -x -C site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
