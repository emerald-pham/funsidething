name: Data safety

on:
  push:
  pull_request:

jobs:
  scanner-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Resolve comparison base
        id: diff-base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$PR_BASE_SHA" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags origin main
            base="$(git merge-base origin/main "$HEAD_SHA")"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$base^{commit}"; then
            echo "Could not resolve a commit to compare against." >&2
            exit 1
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - run: node scripts/test-first-gate.mjs "${{ steps.diff-base.outputs.sha }}"
      - run: npm test
      - run: npm run test:rules

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: scanner-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: mkdir site
      - run: git archive HEAD | tar -x -C site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
