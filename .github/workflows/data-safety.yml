name: Data safety

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  scanner-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Install matching native Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Resolve comparison base
        id: diff-base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$PR_BASE_SHA" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags origin main
            base="$(git merge-base origin/main "$HEAD_SHA")"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$base^{commit}"; then
            echo "Could not resolve a commit to compare against." >&2
            exit 1
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - run: node scripts/test-first-gate.mjs "${{ steps.diff-base.outputs.sha }}"
      - name: Bind exact native candidate tree
        shell: bash
        run: echo "CHAIN_NATIVE_CANDIDATE_TREE=$(git rev-parse "${GITHUB_SHA}^{tree}")" >> "$GITHUB_ENV"
      - name: Run complete regression cohort
        id: cohort
        run: |
          node scripts/agent-tools/ci-routing.mjs --comparison-base "${{ steps.diff-base.outputs.sha }}" --evidence-dir "${{ runner.temp }}/ci-routing"
          decision="$(node -p "require('${{ runner.temp }}/ci-routing/routing.json').decision")"
          if [[ "$decision" == "full" ]]; then
            npm test
          elif [[ "$decision" != "reuse" ]]; then
            echo "Unknown routing decision" >&2
            exit 1
          fi
        env:
          CHAIN_NATIVE_CANDIDATE_SHA: ${{ github.sha }}
          CHAIN_NATIVE_OUTPUT: ${{ runner.temp }}/installed-client-regression
      - name: Preserve native regression evidence
        if: always() && steps.cohort.outputs.decision == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: installed-client-regression-${{ github.sha }}
          path: ${{ runner.temp }}/installed-client-regression
          if-no-files-found: error
      - run: npm run test:rules
      - name: Announce regression context ${{ steps.cohort.outputs.context }}
        run: echo "Exact context bound by ci-routing"
      - name: Backward compatibility
        env:
          COMPATIBILITY_BASE_SHA: ${{ steps.diff-base.outputs.sha }}
        run: npm run test:compatibility
      - name: Complete regression context ${{ steps.cohort.outputs.context }}
        if: steps.cohort.outputs.decision == 'full'
        run: echo "Complete required regression cohort and native artifacts succeeded"
      - name: Preserve routing observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-routing
          if-no-files-found: error

  release-evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact-SHA risk-based review evidence for the deployed commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-evidence.mjs verify-deployment "${{ github.sha }}" "${{ github.event.before }}"

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [scanner-tests, release-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: mkdir site
      - run: git archive HEAD | tar -x -C site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
