name: Diagnostic native view activation comparison (nonmergeable)
on:
  push:
    branches: [diagnose/webkit-native-activation]
permissions:
  contents: read
jobs:
  diagnostic-mobile-startup:
    name: diagnostic-required-1GB-reduced-${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, native-active]
    env:
      CHAIN_TEST_EVENT_POLICY: outgoing-branch-push-v1
      CHAIN_TEST_SOURCE_SHA: ${{ github.sha }}
      CHAIN_DIAGNOSTIC_MOTION: reduced
      CHAIN_DIAGNOSTIC_ACTIVATION: ${{ matrix.variant }}
      FROZEN_APP_COMMIT: '6dde63c21525c5c792bc84ff4c24158fdf446943'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - name: Bind frozen app bytes and separate diagnostic runner identity
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';import{execFileSync}from'node:child_process';import{createHash}from'node:crypto';import assert from'node:assert/strict';
          const git=(...args)=>execFileSync('git',args,{maxBuffer:32*1024*1024}),hash=bytes=>createHash('sha256').update(bytes).digest('hex'),base=process.env.FROZEN_APP_COMMIT,inventory=JSON.parse(fs.readFileSync('scripts/button-safety-inventory.json'));
          const assets=git('ls-files').toString().trim().split('\n').filter(file=>file!=='tests.js'&&!file.startsWith('scripts/')&&(/\.(html|js|css|svg|png|webmanifest)$/.test(file)||Object.hasOwn(inventory.requiredRuntimeAssets,file)));
          const rows=assets.map(file=>{const expected=hash(git('show',base+':'+file)),actual=hash(fs.readFileSync(file));assert.equal(actual,expected,'Frozen application asset '+file);return{file,sha256:actual};});
          const report={kind:'diagnostic-only-source-binding',frozenAppCommit:base,diagnosticCommit:git('rev-parse','HEAD').toString().trim(),diagnosticTree:git('rev-parse','HEAD^{tree}').toString().trim(),workflowBlob:git('rev-parse','HEAD:.github/workflows/data-safety.yml').toString().trim(),motion:process.env.CHAIN_DIAGNOSTIC_MOTION,activationVariant:process.env.CHAIN_DIAGNOSTIC_ACTIVATION,assets:rows,originalUninstrumentedControl:{runId:'40356760855',sourceSha:'3781d21b3e2592d0942ca80eeabbebea44557809',tree:'651a52d185175417b8e403ae2cf36e24af96c620',requiredNormalGapMs:1431,requiredNormalPeakBytes:913702912,oomKills:0}};
          fs.mkdirSync(process.env.RUNNER_TEMP+'/mobile-startup',{recursive:true});fs.writeFileSync(process.env.RUNNER_TEMP+'/mobile-startup/source-binding.json',JSON.stringify(report,null,2)+'\n');
          JS
      - name: Fresh real capped control and original full story with bounded phase observer
        run: node scripts/button-safety-mobile-memory.mjs --run --profile required-1gb --output-dir "$RUNNER_TEMP/mobile-startup/capped"
      - name: Preserve actual outcome and owned cleanup without canonical aggregation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-mobile-activation-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mobile-startup
          if-no-files-found: error
