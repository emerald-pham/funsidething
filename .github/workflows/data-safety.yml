name: Data safety

on:
  push:
  pull_request:

jobs:
  scanner-tests:
    if: ${{ !(github.repository == 'emerald-pham/funsidething' && github.event_name == 'push' && github.ref == 'refs/heads/diagnose/187-linux-consumers' && github.event.deleted != true) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Install matching native Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Resolve comparison base
        id: diff-base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$PR_BASE_SHA" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags origin main
            base="$(git merge-base origin/main "$HEAD_SHA")"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$base^{commit}"; then
            echo "Could not resolve a commit to compare against." >&2
            exit 1
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - run: node scripts/test-first-gate.mjs "${{ steps.diff-base.outputs.sha }}"
      - name: Bind exact native candidate tree
        shell: bash
        run: echo "CHAIN_NATIVE_CANDIDATE_TREE=$(git rev-parse "${GITHUB_SHA}^{tree}")" >> "$GITHUB_ENV"
      - run: npm test
        env:
          CHAIN_NATIVE_CANDIDATE_SHA: ${{ github.sha }}
          CHAIN_NATIVE_OUTPUT: ${{ runner.temp }}/installed-client-regression
      - name: Preserve native regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-client-regression-${{ github.sha }}
          path: ${{ runner.temp }}/installed-client-regression
          if-no-files-found: error
      - run: npm run test:rules
      - name: Backward compatibility
        env:
          COMPATIBILITY_BASE_SHA: ${{ steps.diff-base.outputs.sha }}
        run: npm run test:compatibility

  linux-diagnostic-187:
    if: github.repository == 'emerald-pham/funsidething' && github.event_name == 'push' && github.ref == 'refs/heads/diagnose/187-linux-consumers' && github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        id: diagnostic-checkout
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        id: diagnostic-node
        with:
          node-version: '22.23.3'
      - name: Preserve setup outcome even when checkout or Node setup fails
        id: diagnostic-setup-evidence
        if: always()
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          CHECKOUT_OUTCOME: ${{ steps.diagnostic-checkout.outcome }}
          NODE_OUTCOME: ${{ steps.diagnostic-node.outcome }}
        run: |
          for outcome in "$CHECKOUT_OUTCOME" "$NODE_OUTCOME"; do
            case "$outcome" in success|failure|cancelled|skipped) ;; *) exit 1 ;; esac
          done
          mkdir -p "$RUNNER_TEMP/linux-diagnostic-187"
          printf '{"schemaVersion":1,"checkout":"%s","nodeSetup":"%s","scope":"setup-only; step output remains in Actions log"}\n' "$CHECKOUT_OUTCOME" "$NODE_OUTCOME" > "$RUNNER_TEMP/linux-diagnostic-187/setup.json"
      - name: Record immutable H and J consumers once
        run: node scripts/agent-tools/linux-diagnostic-187.mjs --repo "$GITHUB_WORKSPACE" --evidence-dir "$RUNNER_TEMP/linux-diagnostic-187/run" --scratch-parent "$RUNNER_TEMP"
      - name: Preserve diagnostic evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-diagnostic-187-${{ github.sha }}
          path: ${{ runner.temp }}/linux-diagnostic-187
          if-no-files-found: error
          retention-days: 14
  release-evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact-SHA risk-based review evidence for the deployed commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-evidence.mjs verify-deployment "${{ github.sha }}" "${{ github.event.before }}"

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [scanner-tests, release-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: mkdir site
      - run: git archive HEAD | tar -x -C site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
