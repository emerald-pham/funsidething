name: Data safety

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, edited]

env:
  CHAIN_CI_TOPOLOGY: four-groups-v1
  CHAIN_TEST_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validation-context:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.diff-base.outputs.sha }}
      context: ${{ steps.plan.outputs.context }}
      policy: ${{ steps.plan.outputs.policy }}
      tree: ${{ steps.plan.outputs.tree }}
      workflow-blob: ${{ steps.plan.outputs.workflow-blob }}
      input-keys: ${{ steps.plan.outputs.input-keys }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enforce CI reuse contract
        run: node --test --test-name-pattern='^test group workflow consumer forbids duplicate execution for a verified input pass$|^workflow emulator gate reuses a verified pass and executes an uncovered gate$' scripts/agent-tools/test-groups.test.mjs scripts/agent-tools/ci-routing.test.mjs
      - name: Resolve comparison base
        id: diff-base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$PR_BASE_SHA" ]]; then
            base="$PR_BASE_SHA"
          elif [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git fetch --no-tags origin main
            base="$(git merge-base origin/main "$HEAD_SHA")"
          else
            base="$PUSH_BEFORE_SHA"
          fi
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$base^{commit}"; then
            echo "Could not resolve a commit to compare against." >&2
            exit 1
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Describe required cohort
        run: npm run test:group -- --describe --group core --output-dir "$RUNNER_TEMP/descriptor" --repository "$GITHUB_REPOSITORY" --event-policy "$GITHUB_EVENT_NAME" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$CHAIN_TEST_SOURCE_SHA" --comparison-base "${{ steps.diff-base.outputs.sha }}"
      - name: Bind exact validation context
        id: plan
        run: node scripts/agent-tools/ci-routing.mjs --plan-only 1 --descriptor "$RUNNER_TEMP/descriptor/descriptor.json" --comparison-base "${{ steps.diff-base.outputs.sha }}" --evidence-dir "$RUNNER_TEMP/context"
      - name: Actual checkout ${{ github.sha }} tree ${{ steps.plan.outputs.tree }}
        run: git rev-parse HEAD
      - name: Validation source ${{ env.CHAIN_TEST_SOURCE_SHA }} base ${{ steps.diff-base.outputs.sha }}
        run: git cat-file -e "$CHAIN_TEST_SOURCE_SHA^{commit}"
      - name: Workflow blob ${{ steps.plan.outputs.workflow-blob }} policy four-groups-v1
        run: git rev-parse HEAD:.github/workflows/data-safety.yml
      - name: Announce regression context ${{ steps.plan.outputs.context }}
        run: echo "Bound source, checkout, comparison and complete cohort before execution"
      - name: Preserve validation context
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/descriptor
            ${{ runner.temp }}/context
          if-no-files-found: error

  event-gates:
    needs: [validation-context, cohort-routing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        if: ${{ !contains(fromJSON(needs.cohort-routing.outputs.reused), 'rules') || !contains(fromJSON(needs.cohort-routing.outputs.reused), 'compatibility') }}
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        if: ${{ !contains(fromJSON(needs.cohort-routing.outputs.reused), 'rules') || !contains(fromJSON(needs.cohort-routing.outputs.reused), 'compatibility') }}
      - run: node scripts/test-first-gate.mjs "${{ needs.validation-context.outputs.base }}"
      - uses: actions/download-artifact@v4
        with:
          name: ci-routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-routing
      - name: Execute CI gate rules input ${{ fromJSON(needs.validation-context.outputs.input-keys).rules }}
        if: ${{ !contains(fromJSON(needs.cohort-routing.outputs.reused), 'rules') }}
        run: echo "Executing previously uncovered rules inputs"
      - name: Firestore rules or verified original pass
        id: rules
        run: node scripts/agent-tools/ci-pass-reuse.mjs run-gate --gate rules --proof "$RUNNER_TEMP/ci-routing/routing.json" --output-dir "$RUNNER_TEMP/emulator-gates/rules" --comparison-base "${{ needs.validation-context.outputs.base }}"
      - name: Execute CI gate compatibility input ${{ fromJSON(needs.validation-context.outputs.input-keys).compatibility }}
        if: ${{ !contains(fromJSON(needs.cohort-routing.outputs.reused), 'compatibility') }}
        run: echo "Executing previously uncovered compatibility inputs"
      - name: Backward compatibility
        id: compatibility
        env:
          COMPATIBILITY_BASE_SHA: ${{ needs.validation-context.outputs.base }}
        run: node scripts/agent-tools/ci-pass-reuse.mjs run-gate --gate compatibility --proof "$RUNNER_TEMP/ci-routing/routing.json" --output-dir "$RUNNER_TEMP/emulator-gates/compatibility" --comparison-base "${{ needs.validation-context.outputs.base }}"
      - name: Preserve emulator gate evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-gates-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/emulator-gates
          if-no-files-found: error
      - name: Completed CI gate rules input ${{ steps.rules.outputs.key }} result ${{ steps.rules.outputs.result }}
        if: always() && steps.rules.outputs.mode == 'executed' && steps.rules.outputs.key != '' && steps.upload.outcome == 'success'
        run: echo "Original rules execution and retained result verified"
      - name: Completed CI gate compatibility input ${{ steps.compatibility.outputs.key }} result ${{ steps.compatibility.outputs.result }}
        if: always() && steps.compatibility.outputs.mode == 'executed' && steps.compatibility.outputs.key != '' && steps.upload.outcome == 'success'
        run: echo "Original compatibility execution and retained result verified"

  cohort-routing:
    needs: validation-context
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      decision: ${{ steps.route.outputs.decision }}
      reused: ${{ steps.route.outputs.reused }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: validation-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation
      - name: Resolve complete cohort coverage
        id: route
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/agent-tools/ci-routing.mjs --descriptor "$RUNNER_TEMP/validation/descriptor/descriptor.json" --comparison-base "${{ needs.validation-context.outputs.base }}" --evidence-dir "$RUNNER_TEMP/ci-routing"
      - name: Preserve routing observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-routing
          if-no-files-found: error

  regression:
    name: regression-${{ matrix.group }}
    needs: [validation-context, cohort-routing]
    if: always() && needs.validation-context.result == 'success' && needs.cohort-routing.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [core, scenery, persistence-recovery, native-process]
    env:
      CHAIN_TEST_EVENT_POLICY: ${{ needs.validation-context.outputs.policy }}
      CHAIN_TEST_COMPARISON_BASE: ${{ needs.validation-context.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        if: needs.cohort-routing.outputs.decision == 'full' && !contains(fromJSON(needs.cohort-routing.outputs.reused), matrix.group)
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        if: needs.cohort-routing.outputs.decision == 'full' && !contains(fromJSON(needs.cohort-routing.outputs.reused), matrix.group)
      - name: Install matching native Chromium
        if: needs.cohort-routing.outputs.decision == 'full' && !contains(fromJSON(needs.cohort-routing.outputs.reused), matrix.group)
        run: npx --no-install playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: ci-routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-routing
      - name: Execute CI gate ${{ matrix.group }} input ${{ fromJSON(needs.validation-context.outputs.input-keys)[matrix.group] }}
        if: needs.cohort-routing.outputs.decision == 'full' && !contains(fromJSON(needs.cohort-routing.outputs.reused), matrix.group)
        run: echo "Executing previously uncovered group inputs"
      - name: Execute or reuse assigned group
        id: group
        run: node scripts/agent-tools/ci-pass-reuse.mjs run-group --proof "$RUNNER_TEMP/ci-routing/routing.json" --group "${{ matrix.group }}" --output-dir "$RUNNER_TEMP/group" --repository "$GITHUB_REPOSITORY" --event-policy "$CHAIN_TEST_EVENT_POLICY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$CHAIN_TEST_SOURCE_SHA" --comparison-base "$CHAIN_TEST_COMPARISON_BASE"
      - name: Preserve actual group results and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group }}
          path: ${{ runner.temp }}/group
          if-no-files-found: error
      - name: Completed CI gate ${{ matrix.group }} input ${{ steps.group.outputs.key }} result ${{ steps.group.outputs.result }}
        if: success() && steps.group.outputs.mode == 'executed' && steps.group.outputs.key != ''
        run: echo "Original group execution and retained result verified"

  scanner-tests:
    needs: [validation-context, event-gates, cohort-routing, regression]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      CHAIN_TEST_EVENT_POLICY: ${{ needs.validation-context.outputs.policy }}
      CHAIN_TEST_COMPARISON_BASE: ${{ needs.validation-context.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retain actual predecessor outcomes
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP+"/needs.json",process.env.NEEDS_JSON)'
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: validation-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validation
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: regression-${{ github.run_id }}-${{ github.run_attempt }}-core
          path: ${{ runner.temp }}/groups/core
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: regression-${{ github.run_id }}-${{ github.run_attempt }}-scenery
          path: ${{ runner.temp }}/groups/scenery
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: regression-${{ github.run_id }}-${{ github.run_attempt }}-persistence-recovery
          path: ${{ runner.temp }}/groups/persistence-recovery
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: regression-${{ github.run_id }}-${{ github.run_attempt }}-native-process
          path: ${{ runner.temp }}/groups/native-process
      - name: Recheck covered producer immediately before aggregation
        if: needs.cohort-routing.outputs.decision == 'reuse' || needs.cohort-routing.outputs.reused != '[]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/agent-tools/ci-routing.mjs --max-wait-ms 0 --descriptor "$RUNNER_TEMP/validation/descriptor/descriptor.json" --comparison-base "$CHAIN_TEST_COMPARISON_BASE" --evidence-dir "$RUNNER_TEMP/final-routing"
      - name: Verify complete required cohort
        id: aggregate
        if: always()
        run: |
          npm run test:group -- --aggregate --group core --output-dir "$RUNNER_TEMP/aggregate" --results-dir "$RUNNER_TEMP/groups" --needs-json "$RUNNER_TEMP/needs.json" --proof "$RUNNER_TEMP/final-routing/routing.json" --repository "$GITHUB_REPOSITORY" --event-policy "$CHAIN_TEST_EVENT_POLICY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --source-sha "$CHAIN_TEST_SOURCE_SHA" --comparison-base "$CHAIN_TEST_COMPARISON_BASE"
      - name: Preserve verified aggregate and final observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aggregate
            ${{ runner.temp }}/final-routing
          if-no-files-found: error
      - name: Verified complete cohort ${{ needs.validation-context.outputs.context }} report ${{ steps.aggregate.outputs.report }} mode ${{ needs.cohort-routing.outputs.decision == 'reuse' && 'reuse' || steps.aggregate.outputs.mode }}
        if: success()
        run: echo "Required current execution or original producer coverage verified"
      - name: Complete regression context ${{ needs.validation-context.outputs.context }} report ${{ steps.aggregate.outputs.report }}
        if: success() && needs.cohort-routing.outputs.decision == 'full' && needs.cohort-routing.outputs.reused == '[]'
        run: echo "Every required group, outcome, raw hash, native report and gate reconciled"

  release-evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact-SHA risk-based review evidence for the deployed commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-evidence.mjs verify-deployment "${{ github.sha }}" "${{ github.event.before }}"

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [scanner-tests, release-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: mkdir site
      - run: git archive HEAD | tar -x -C site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
