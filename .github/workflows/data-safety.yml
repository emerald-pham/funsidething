name: Diagnostic scoped raster submission comparison (nonmergeable)
on:
  push:
    branches: [diagnose/webkit-raster-submission]
permissions:
  contents: read
jobs:
  diagnostic-mobile-startup:
    name: diagnostic-required-1GB-normal-${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, backdrop-raster-off, foreground-raster-off, both-raster-off]
    env:
      CHAIN_TEST_EVENT_POLICY: outgoing-branch-push-v1
      CHAIN_TEST_SOURCE_SHA: ${{ github.sha }}
      CHAIN_DIAGNOSTIC_MOTION: normal
      CHAIN_DIAGNOSTIC_ACTIVATION: baseline
      CHAIN_DIAGNOSTIC_WORKLOAD: full-app
      CHAIN_DIAGNOSTIC_RASTER: ${{ matrix.variant }}
      FROZEN_APP_COMMIT: 'b176026825e4f9539780f745fe60e09cf348d288'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - name: Bind frozen app bytes and separate diagnostic runner identity
        run: |
          node --input-type=module <<'JS'
          import {buildRasterOverlay} from './scripts/scene-raster-diagnostic.mjs';
          import fs from 'node:fs';import{execFileSync}from'node:child_process';import{createHash}from'node:crypto';import assert from'node:assert/strict';
          const git=(...args)=>execFileSync('git',args,{maxBuffer:32*1024*1024}),hash=bytes=>createHash('sha256').update(bytes).digest('hex'),base=process.env.FROZEN_APP_COMMIT,inventory=JSON.parse(fs.readFileSync('scripts/button-safety-inventory.json'));
          const assets=git('ls-files').toString().trim().split('\n').filter(file=>file!=='tests.js'&&!file.startsWith('scripts/')&&(/\.(html|js|css|svg|png|webmanifest)$/.test(file)||Object.hasOwn(inventory.requiredRuntimeAssets,file)));
          const rows=assets.map(file=>{const expected=hash(git('show',base+':'+file)),actual=hash(fs.readFileSync(file));assert.equal(actual,expected,'Frozen application asset '+file);return{file,sha256:actual};});
          const raster=buildRasterOverlay(fs.readFileSync('landscape.js','utf8'),process.env.CHAIN_DIAGNOSTIC_RASTER);
          const report={rasterOverlay:raster.receipt,kind:'diagnostic-only-source-binding',frozenAppCommit:base,diagnosticCommit:git('rev-parse','HEAD').toString().trim(),diagnosticTree:git('rev-parse','HEAD^{tree}').toString().trim(),workflowBlob:git('rev-parse','HEAD:.github/workflows/data-safety.yml').toString().trim(),motion:process.env.CHAIN_DIAGNOSTIC_MOTION,activationVariant:process.env.CHAIN_DIAGNOSTIC_ACTIVATION,workload:process.env.CHAIN_DIAGNOSTIC_WORKLOAD,rasterVariant:process.env.CHAIN_DIAGNOSTIC_RASTER,assets:rows,originalUninstrumentedControl:{runId:'40405886643',sourceSha:'b176026825e4f9539780f745fe60e09cf348d288',mergeSha:'0e60b3605d2d5b709733a6401bd793acad0aca81',tree:'27e293d0fa9aae62a906b36dc984bd0ef184f956',requiredNormalGapMs:2490,requiredNormalPeakBytes:889114624,oomKills:0}};
          fs.mkdirSync(process.env.RUNNER_TEMP+'/mobile-startup',{recursive:true});fs.writeFileSync(process.env.RUNNER_TEMP+'/mobile-startup/served-landscape.js',raster.body);fs.writeFileSync(process.env.RUNNER_TEMP+'/mobile-startup/source-binding.json',JSON.stringify(report,null,2)+'\n');
          JS
      - name: Fresh capped owner and selected raster arm with original input gates
        run: node scripts/button-safety-mobile-memory.mjs --run --profile required-1gb --output-dir "$RUNNER_TEMP/mobile-startup/capped"
      - name: Preserve actual outcome and owned cleanup without canonical aggregation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-mobile-raster-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mobile-startup
          if-no-files-found: error
